name: Release Blast

on:
  workflow_dispatch:
  schedule:
    - cron: '0 5 * * *' # Every day at 13:00 in Taiwan (UTC 05:00), one hour after SMM

permissions:
  contents: write
  copilot-requests: write

# Serialize scheduled and manual writes to the rolling test release.
concurrency:
  group: blast-test-release
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      spd_tag: ${{ steps.versions.outputs.spd_tag }}
      blast_version: ${{ steps.versions.outputs.blast_version }}
      smm_tag: ${{ steps.versions.outputs.smm_tag }}
      smm_ref: ${{ steps.decision.outputs.smm_ref }}
      mode: ${{ steps.decision.outputs.mode }}
      release_tag: ${{ steps.versions.outputs.release_tag }}
    steps:
      - name: Checkout Blast
        uses: actions/checkout@v4
        with:
          path: blast

      - name: Resolve versions
        id: versions
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          spd_tag=$(gh api repos/00-Evan/shattered-pixel-dungeon/releases/latest --jq '.tag_name // empty')
          smm_tag=$(gh api repos/edward9s/Shattered-Master-Mode/releases/latest --jq '.tag_name // empty')
          smm_main_sha=$(gh api repos/edward9s/Shattered-Master-Mode/git/ref/heads/main --jq '.object.sha')
          if [[ -z "$spd_tag" || ! "$smm_tag" =~ -m([0-9]+(\.[0-9]+)*)$ ]]; then
            echo "::error::Could not resolve SPD and SMM releases"
            exit 1
          fi
          version=$(python blast/scripts/extract_version.py blast/core/src/main/java/com/spd/blast/BlastVersion.java)
          release_tag="Blast-v$version-SPD-$spd_tag"
          echo "spd_tag=$spd_tag" >> "$GITHUB_OUTPUT"
          echo "smm_tag=$smm_tag" >> "$GITHUB_OUTPUT"
          echo "smm_main_sha=$smm_main_sha" >> "$GITHUB_OUTPUT"
          echo "blast_version=$version" >> "$GITHUB_OUTPUT"
          echo "release_tag=$release_tag" >> "$GITHUB_OUTPUT"


      - name: Test release decision rules
        run: python -m unittest discover -s blast/tests -p 'test_release_policy.py'

      - name: Decide build mode
        id: decision
        env:
          GH_TOKEN: ${{ github.token }}
          BLAST_VERSION: ${{ steps.versions.outputs.blast_version }}
          SPD_TAG: ${{ steps.versions.outputs.spd_tag }}
          SMM_MAIN_SHA: ${{ steps.versions.outputs.smm_main_sha }}
          SMM_TAG: ${{ steps.versions.outputs.smm_tag }}
        shell: bash
        run: |
          set -euo pipefail
          mode=$(python blast/scripts/decide_release.py \
            "$BLAST_VERSION" "$GITHUB_SHA" "$SPD_TAG" "$SMM_MAIN_SHA" "$SMM_TAG")
          case "$mode" in
            formal) smm_ref="$SMM_TAG" ;;
            test|skip) smm_ref="$SMM_MAIN_SHA" ;;
            *) echo "::error::Unknown release mode: $mode"; exit 1 ;;
          esac
          echo "mode=$mode" >> "$GITHUB_OUTPUT"
          echo "smm_ref=$smm_ref" >> "$GITHUB_OUTPUT"
          echo "Release decision: $mode"
  build:
    needs: prepare
    if: needs.prepare.outputs.mode != 'skip'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Blast
        uses: actions/checkout@v4
        with:
          path: blast
          fetch-depth: 0

      - name: Checkout SPD for Blast
        uses: actions/checkout@v4
        with:
          repository: 00-Evan/shattered-pixel-dungeon
          ref: ${{ needs.prepare.outputs.spd_tag }}
          path: spd-blast

      - name: Checkout SPD for SMM
        uses: actions/checkout@v4
        with:
          repository: 00-Evan/shattered-pixel-dungeon
          ref: ${{ needs.prepare.outputs.spd_tag }}
          path: spd-smm

      - name: Checkout SMM
        uses: actions/checkout@v4
        with:
          repository: edward9s/Shattered-Master-Mode
          ref: ${{ needs.prepare.outputs.smm_ref }}
          path: mod

      - name: Extract built SMM version
        id: smm_version
        run: echo "value=$(python mod/scripts/extract_version.py mod/core/src/main/java/com/spd/mod/ModGame.java)" >> "$GITHUB_OUTPUT"

      - name: Verify signing configuration
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          for key in KEYSTORE_BASE64 KEY_ALIAS STORE_PASSWORD KEY_PASSWORD; do
            if [ -z "${!key}" ]; then
              echo "::error::Missing required signing secret: $key"
              exit 1
            fi
          done

      - name: Install icon generation dependency
        run: python -m pip install Pillow==11.3.0

      - name: Apply Blast and optional SMM
        shell: bash
        run: |
          set -euo pipefail
          for target in spd-blast spd-smm; do
            cp -a blast/core/. "$target/core/"
            bash blast/integration/shattered/apply.sh "$target" blast
          done
          python mod/scripts/rebase_source.py spd-smm mod
          python mod/scripts/patch_android.py spd-smm
          python mod/scripts/inject_mod.py spd-smm
          cp -a mod/core/. spd-smm/core/
          if [[ -d mod/android ]]; then cp -a mod/android/. spd-smm/android/; fi
          if [[ -d mod/desktop ]]; then cp -a mod/desktop/. spd-smm/desktop/; fi
          if [[ -d mod/assets ]]; then cp -a mod/assets/. spd-smm/assets/; fi
          python mod/scripts/patch_depth.py 26 spd-smm

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build Blast release APK and JAR
        working-directory: spd-blast
        shell: bash
        run: |
          set -euo pipefail
          chmod +x ./gradlew
          ./gradlew :android:assembleRelease :desktop:release

      - name: Install Android signer tools
        shell: bash
        run: $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "build-tools;29.0.3"

      - name: Sign Blast Android APK
        uses: r0adkll/sign-android-release@v1
        id: sign_blast
        with:
          releaseDirectory: spd-blast/android/build/outputs/apk/release
          signingKeyBase64: ${{ secrets.KEYSTORE_BASE64 }}
          alias: ${{ secrets.KEY_ALIAS }}
          keyStorePassword: ${{ secrets.STORE_PASSWORD }}
          keyPassword: ${{ secrets.KEY_PASSWORD }}

      - name: Stage Blast release assets
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p out
          jar=$(find spd-blast/desktop/build/libs -maxdepth 1 -name '*.jar' -type f -print -quit)
          test -f "$jar"
          test -f "${{ steps.sign_blast.outputs.signedReleaseFile }}"
          base="${{ needs.prepare.outputs.release_tag }}"
          cp "${{ steps.sign_blast.outputs.signedReleaseFile }}" "out/$base.apk"
          cp "$jar" "out/$base.jar"

      - name: Build SMM release APK and JAR
        working-directory: spd-smm
        shell: bash
        run: |
          set -euo pipefail
          chmod +x ./gradlew
          ./gradlew :android:assembleRelease :desktop:release

      - name: Sign SMM Android APK
        uses: r0adkll/sign-android-release@v1
        id: sign_smm
        with:
          releaseDirectory: spd-smm/android/build/outputs/apk/release
          signingKeyBase64: ${{ secrets.KEYSTORE_BASE64 }}
          alias: ${{ secrets.KEY_ALIAS }}
          keyStorePassword: ${{ secrets.STORE_PASSWORD }}
          keyPassword: ${{ secrets.KEY_PASSWORD }}

      - name: Stage SMM release assets
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p out
          jar=$(find spd-smm/desktop/build/libs -maxdepth 1 -name '*.jar' -type f -print -quit)
          test -f "$jar"
          test -f "${{ steps.sign_smm.outputs.signedReleaseFile }}"
          base="${{ needs.prepare.outputs.release_tag }}-SMM-m${{ steps.smm_version.outputs.value }}"
          cp "${{ steps.sign_smm.outputs.signedReleaseFile }}" "out/$base.apk"
          cp "$jar" "out/$base.jar"

      - name: Find previous Blast release
        if: needs.prepare.outputs.mode == 'formal'
        id: previous
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.prepare.outputs.release_tag }}
        shell: bash
        run: |
          set -euo pipefail
          previous=$(gh release list --repo "$GITHUB_REPOSITORY" --limit 100 --json tagName --jq '.[].tagName' \
            | grep '^Blast-v' | grep -vxF "$RELEASE_TAG" | head -1 || true)
          echo "tag=$previous" >> "$GITHUB_OUTPUT"

      - name: Set up Node.js for Copilot
        if: needs.prepare.outputs.mode == 'formal'
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Copilot CLI
        if: needs.prepare.outputs.mode == 'formal'
        run: npm install -g @github/copilot

      - name: Generate Blast changelog with Copilot
        if: needs.prepare.outputs.mode == 'formal'
        working-directory: blast
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PREV_TAG: ${{ steps.previous.outputs.tag }}
        run: |
          set -euo pipefail
          rm -f release-notes-ai.md
          if [[ -n "$PREV_TAG" ]] && git rev-parse --verify "$PREV_TAG^{commit}" >/dev/null 2>&1; then
            SCOPE="Compare git tag $PREV_TAG to HEAD using git log and git diff. Describe only the final player-visible changes since that release."
          else
            SCOPE="This is the first Blast release or its previous tag is unavailable. Inspect the current Blast code and git history, and summarize the main player-visible Blast gameplay features."
          fi

          copilot -p "Generate concise player-facing changelog notes for Blast Pixel Dungeon.

          $SCOPE

          Rules:
          - Inspect source changes and actual final behavior, including integration patches. Do not rely on commit messages alone.
          - Describe meaningful Blast gameplay, bombs, terrain destruction, controls, UI, compatibility and balance changes.
          - Combine related changes into a single bullet that describes the final behavior.
          - Ignore version bumps, CI/build/release workflow changes, docs-only changes, refactors, tests, and reverted changes unless they affect gameplay.
          - Ignore Shattered Pixel Dungeon upstream changes and Shattered Master Mode changes; their versions are listed separately.
          - Do not invent features or behavior.
          - Use concise English with at most 8 Markdown bullet points. No heading, preamble, links or commentary.
          - If there are no player-visible changes, write exactly: NO_USER_FACING_CHANGES
          - Write only the final result to release-notes-ai.md in the current directory." \
            --allow-tool='shell(git:*)' \
            --allow-tool=write \
            --no-ask-user
          test -s release-notes-ai.md

      - name: Compose release notes
        if: needs.prepare.outputs.mode == 'formal'
        working-directory: blast
        shell: bash
        env:
          PREV_TAG: ${{ steps.previous.outputs.tag }}
          SPD_TAG: ${{ needs.prepare.outputs.spd_tag }}
          SMM_VER: ${{ steps.smm_version.outputs.value }}
        run: |
          set -euo pipefail
          changes="../release-notes-changes.md"
          notes="../release-notes.md"
          : > "$changes"
          if [[ -z "$PREV_TAG" ]]; then
            echo "- Initial release built against Shattered Pixel Dungeon $SPD_TAG." >> "$changes"
          else
            previous_spd="${PREV_TAG##*-SPD-}"
            if [[ "$previous_spd" != "$SPD_TAG" ]]; then
              echo "- Updated base game from Shattered Pixel Dungeon $previous_spd to $SPD_TAG." >> "$changes"
            fi
          fi
          ai_notes=$(cat release-notes-ai.md)
          if [[ "$ai_notes" != "NO_USER_FACING_CHANGES" ]]; then
            cat release-notes-ai.md >> "$changes"
            echo >> "$changes"
          fi
          if [[ ! -s "$changes" ]]; then
            echo "- Maintenance release with no player-visible gameplay changes." >> "$changes"
          fi
          {
            echo "## Changes"
            echo
            cat "$changes"
            echo
            echo "> Blast Pixel Dungeon based on SPD $SPD_TAG. Downloads include standalone and SMM m$SMM_VER APK/JAR variants."
          } > "$notes"
          cat "$notes"

      - name: Verify release files
        shell: bash
        run: |
          set -euo pipefail
          test "$(find out -maxdepth 1 -type f \( -name '*.jar' -o -name '*.apk' \) | wc -l)" -eq 4

      - name: Publish immutable official release
        if: needs.prepare.outputs.mode == 'formal'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.prepare.outputs.release_tag }}
        shell: bash
        run: |
          set -euo pipefail
          # A new manually assigned Blast version creates one official release.
          # No --clobber, no asset removal, no existing tag rewrite.
          gh release create "$RELEASE_TAG" out/* \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "$RELEASE_TAG" \
            --notes-file release-notes.md

      - name: Publish rolling test release
        if: needs.prepare.outputs.mode == 'test'
        env:
          GH_TOKEN: ${{ github.token }}
          SPD_TAG: ${{ needs.prepare.outputs.spd_tag }}
          SMM_TAG: ${{ needs.prepare.outputs.smm_tag }}
          TEST_TAG: build-test
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          files=(out/*.apk out/*.jar)
          if [[ ${#files[@]} -ne 4 ]]; then
            echo "::error::Expected exactly four APK/JAR files"
            exit 1
          fi
          notes=$(printf 'Latest successful test build.\n\nBlast commit: %s\nSPD: %s\nSMM main commit: %s\nSMM release: %s\n' \
            "$GITHUB_SHA" "$SPD_TAG" "$(git -C mod rev-parse HEAD)" "$SMM_TAG")
          if gh release view "$TEST_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            # Only the rolling test assets may be overwritten.
            gh release upload "$TEST_TAG" "${files[@]}" --repo "$GITHUB_REPOSITORY" --clobber
            gh release edit "$TEST_TAG" --repo "$GITHUB_REPOSITORY" \
              --title "Blast test build" --notes "$notes" --prerelease
          else
            gh release create "$TEST_TAG" "${files[@]}" \
              --repo "$GITHUB_REPOSITORY" \
              --target "$GITHUB_SHA" \
              --title "Blast test build" \
              --notes "$notes" \
              --prerelease \
              --latest=false
          fi
          assets=$(gh release view "$TEST_TAG" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name')
          while IFS= read -r asset; do
            if [[ -n "$asset" && ! -f "out/$asset" ]]; then
              gh release delete-asset "$TEST_TAG" "$asset" --repo "$GITHUB_REPOSITORY" --yes
            fi
          done <<< "$assets"
          gh api --method PATCH "repos/$GITHUB_REPOSITORY/git/refs/tags/$TEST_TAG" \
            -f sha="$GITHUB_SHA" -F force=true >/dev/null
