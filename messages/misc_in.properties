blast.settings.indestructible_test_desc=Uji kekebalan bom aktif. Kerusakan akibat ledakan bom akan dicegah sampai pengaturan ini dimatikan.
blast.settings.free_movement_test_desc=Uji menembus rintangan aktif. Kamu dapat melewati rintangan yang didukung sampai pengaturan ini dimatikan.
blast.settings.remote_throw_test_desc=Uji lempar jarak jauh aktif. Dalam mode kendali jarak jauh, kamu dapat membidik dan melempar bom yang dapat dikendalikan tanpa menghabiskan giliran, lalu meledakkannya dengan tombol kendali.
blast.settings.radius=Uji: radius ledakan
blast.save_transfer.export=Ekspor simpanan
blast.save_transfer.import=Impor simpanan
