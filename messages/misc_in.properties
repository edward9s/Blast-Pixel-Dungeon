blast.save_transfer.permission=Izinkan pengelolaan berkas, lalu coba lagi.
blast.remote_bomb.buff_name=Kendali bom
blast.remote_bomb.buff_desc=Tekan dan tahan tombol bom bawah untuk beralih antara mode kendali jarak jauh dan mode berwaktu, tetapi hanya jika tidak ada bom menyala di lantai ini. Mode jarak jauh: tempatkan bom di kakimu tanpa menghabiskan giliran, lalu ledakkan bom tertua dengan tombol bawah. Mode berwaktu: bidik dan lempar bom dengan biaya 1 giliran; bom akan meledak otomatis. Tombol bawah menampilkan hitung mundur terpendek sebagai pengganti hati. Mode pilihan tetap tersimpan setelah penyimpanan dan kebangkitan. Setiap lemparan berwaktu memerlukan kapasitas setidaknya 2 dan mengurangi kapasitas maksimum secara permanen sebesar 1; slot terakhir untuk bom jarak jauh. Tes bom tak terbatas menghapus batasan tersebut. Pada kapasitas 1, mode jarak jauh kembali setelah semua bom menyala hilang.
blast.remote_bomb.detonate=Ledakkan bom (tahan: ganti mode)
blast.settings.infinite_bomb=Uji: bom tak terbatas
blast.bomb_maniac.buff_name=Maniak Bom
blast.bomb_maniac.buff_desc=Ketuk tombol tepi layar untuk menaruh bom jarak jauh di kakimu tanpa menggunakan giliran, atau membidik dan melempar bom berwaktu dengan menggunakan 1 giliran, sesuai mode. Maksimum terpasang: %s. Tersedia: %s. Tekan lama untuk memilih atau mengorbankan bom. Ledakan mengembalikan slot yang terpakai. Bom padam yang sudah diambil dapat dikorbankan untuk mengembalikan slot. Setiap lemparan berwaktu memerlukan kapasitas setidaknya 2 dan mengurangi kapasitas maksimum secara permanen sebesar 1; slot terakhir untuk bom jarak jauh. Tes bom tak terbatas menghapus batasan tersebut. Pada kapasitas 1, mode jarak jauh kembali setelah semua bom menyala hilang.
blast.bomb_maniac.window_title=Maniak Bom
blast.bomb_maniac.capacity=Kapasitas: %s / Tersedia: %s
blast.bomb_maniac.imbue=Korbankan bom
blast.bomb_maniac.imbue_prompt=Pilih bom untuk dikorbankan
blast.bomb_maniac.throw=Pasang bom (tahan: atur)
blast.bomb_maniac.no_charges=Tidak ada bom tersedia sampai salah satunya meledak atau bom padam yang diambil dikorbankan.
blast.bomb_maniac.blocked=Tidak bisa memasang bom menyala di sini.
blast.bomb.lit_pickup=Bom yang menyala tidak bisa diambil.
blast.free_movement.buff_name=Menembus rintangan
blast.free_movement.buff_desc=Kamu dapat melewati dinding, pintu terkunci, dan bom menyala. Sisa: %s giliran. Selama efek aktif, bom yang dilempar dari inventaris dan bom yang ditendang monster langka menembus medan dan karakter sebelum mendarat.
blast.radius.buff_name=Ledakan diperluas
blast.radius.buff_desc=Radius ledakan semua bom bertambah %s. Pengambilan normal hanya memberikan maksimum +1.
blast.indestructible.buff_name=Kebal bom
blast.indestructible.buff_desc=Kebal terhadap kerusakan ledakan bom selama %s giliran lagi.
blast.radius_pickup.name=Peningkatan ledakan api
blast.radius_pickup.desc=Saat diambil, radius ledakan semua bom langsung bertambah 1 (batas pengambilan normal +1). Jika efeknya sudah aktif, pengambilan berikutnya memberikan 10 emas. Jika benda ini dihancurkan api atau ledakan, hingga 8 monster muncul di dekatnya dengan adrenalin selama 1.000.000 giliran.
blast.haste_pickup.name=Sepatu kecepatan
blast.haste_pickup.desc=Saat diambil, langsung memberikan efek Ramuan Kecepatan (gerakan tiga kali lebih cepat selama 20 giliran), tanpa harus meminumnya. Jika efek sudah aktif, durasinya bertambah 20 giliran, bukan mendapatkan emas. Jika dihancurkan api atau ledakan, hingga 8 monster muncul di dekatnya dengan adrenalin selama 1.000.000 giliran.
blast.phase_potion.name=Ramuan menembus rintangan
blast.phase_potion.desc=Minum untuk melewati dinding, pintu terkunci, dan bom menyala selama 6 giliran. Bom yang dilempar dari inventaris dan ditendang monster langka juga menembus rintangan dan karakter.
blast.bombproof_scroll.name=Gulungan pelindung bom
blast.bombproof_scroll.desc=Baca untuk menjadi kebal terhadap kerusakan ledakan bom selama 6 giliran.
blast.rubble.name=Puing-puing
blast.rubble.desc=Runtuhan batu akibat bom. Menghalangi pergerakan, tetapi bisa disingkirkan dengan ledakan berikutnya.
blast.remote_bomb.timed_mode=Mode berwaktu (tahan: ganti mode)
blast.remote_bomb.capacity_required=Lemparan bom berwaktu memerlukan kapasitas maksimum setidaknya 2. Slot terakhir disimpan untuk bom kendali jarak jauh. Tes bom tak terbatas menghapus batasan ini.
blast.remote_bomb.last_slot=Kapasitas maksimum sekarang 1. Korbankan bom lain untuk dapat melempar bom berwaktu lagi. Setelah tidak ada bom menyala, mode jarak jauh akan pulih otomatis.
blast.remote_bomb.switch_blocked=Tidak dapat mengganti mode selama masih ada bom menyala di lantai ini.
blast.remote_bomb.timed_enabled=Mode berwaktu diaktifkan.
blast.remote_bomb.remote_enabled=Mode jarak jauh diaktifkan.
blast.bomb_maniac.remote_throw=Lempar jarak jauh (tahan: atur)
blast.bomb_maniac.timed_throw=Lempar berwaktu (tahan: atur)
blast.bomb_maniac.aim=Pilih tempat melempar
blast.death_bomb.name=Bom balasan kematian
blast.death_bomb.desc=Bom bergaya Tengu yang dilempar ke arah pahlawan saat musuh mati akibat ledakan Maniak Bom tanpa menjatuhkan barang. Menghitung 3, 2, 1 lalu melukai karakter dalam jarak dua petak. Bom ini tidak bisa diambil.
blast.death_bomb.cant_pickup=Bom balasan musuh tidak bisa diambil.
blast.death_bomb.ondeath=Kamu terbunuh oleh bom balasan kematian.
