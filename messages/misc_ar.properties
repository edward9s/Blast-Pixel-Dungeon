blast.indestructible.buff_desc=مناعة من ضرر القنابل وتأثيراتها الضارة لمدة %s دورًا إضافيًا.
blast.radius_pickup.name=ترقية الانفجار الناري
blast.radius_pickup.desc=يزيد مدى كل قنبلة تلقائيًا بمقدار 1 عند التقاطها (الحد الأقصى من الالتقاط العادي +1). إذا كان التأثير نشطًا بالفعل، يمنح كل التقاط إضافي 10 قطع ذهبية. إذا تلف هذا العنصر بالنار أو بانفجار، يستدعي ما يصل إلى 8 وحوش بالقرب منه مع تأثير الأدرينالين لمدة 1,000,000 دور.
blast.haste_pickup.name=حذاء السرعة
blast.haste_pickup.desc=يمنح التقاطه فورًا تأثير جرعة السرعة (ثلاثة أضعاف سرعة الحركة لمدة 20 دورًا) دون شرب جرعة. إذا كان تأثير السرعة نشطًا بالفعل، يضيف الالتقاط 20 دورًا أخرى إلى مدته المتبقية بدلًا من منح الذهب. إذا تلف بالنار أو بانفجار، يستدعي ما يصل إلى 8 وحوش قريبة مع تأثير الأدرينالين لمدة 1,000,000 دور.
blast.phase_potion.name=جرعة عبور العوائق
blast.phase_potion.desc=اشربها لعبور الجدران والأبواب المغلقة والقنابل المسلّحة لمدة 6 أدوار. تمر القنابل المرمية من الحقيبة والقنابل التي تركلها الوحوش النادرة عبر العوائق والشخصيات.
