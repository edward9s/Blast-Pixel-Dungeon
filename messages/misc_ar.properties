blast.free_movement.buff_name=عبور العوائق
blast.free_movement.buff_desc=اعبر الجدران والأبواب المغلقة والقنابل المسلّحة. المتبقي: %s دورًا. أثناء التأثير، تمر القنابل المرمية من الحقيبة والقنابل التي تركلها الوحوش النادرة عبر التضاريس والشخصيات قبل هبوطها.
blast.radius.buff_name=انفجارات موسّعة
blast.radius.buff_desc=يزداد نصف قطر انفجار جميع القنابل بمقدار +%s. الحد الأقصى للزيادة من الالتقاط العادي هو +1.
