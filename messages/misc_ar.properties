blast.bomb_maniac.buff_name=مهووس القنابل
blast.bomb_maniac.buff_desc=اضغط على الزر الجانبي لوضع قنبلة متحكم بها عن بُعد عند قدميك دون استهلاك دور، أو للتصويب ورمي قنبلة مؤقتة مقابل دور واحد، بحسب الوضع. السعة القصوى: %s. المتاح: %s. اضغط مطولًا لاختيار القنابل أو دمجها. تحرّر القنابل المتحكم بها عن بُعد خاناتها عند انفجارها. كل رمية مؤقتة تنقص السعة القصوى بمقدار 1 بشكل دائم حتى حد أدنى قدره 1، إلا أثناء اختبار القنابل اللانهائية. ادمج قنابل الحقيبة لزيادة السعة. يمكن دمج القنابل المطفأة والمستعادة لتحرير خاناتها المشغولة.
