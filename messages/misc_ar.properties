blast.remote_bomb.buff_name=التحكم بالقنابل
blast.remote_bomb.buff_desc=اضغط مطولًا على زر القنابل السفلي للتبديل بين الوضعين عندما لا تبقى أي قنبلة مشتعلة. يتطلب الوضع المؤقت سعة قصوى لا تقل عن قنبلتين. كل رمية مؤقتة تنقص السعة القصوى بمقدار خانة واحدة بشكل دائم، مع إبقاء الخانة الأخيرة للقنابل المتحكم بها عن بُعد، إلا عند تفعيل اختبار القنابل اللانهائية. عند زوال كل القنابل المشتعلة ووصول السعة إلى 1، يعود وضع التحكم عن بُعد تلقائيًا. وضع التحكم عن بُعد: ضع القنابل عند قدميك فورًا وفجّر أقدمها بالزر السفلي. الوضع المؤقت: ارمِ القنبلة مقابل دور واحد وانتظر انفجارها تلقائيًا. يُحفظ الوضع المحدد.
blast.remote_bomb.detonate=تفجير قنبلة عن بُعد (ضغط مطوّل: تبديل الوضع)
