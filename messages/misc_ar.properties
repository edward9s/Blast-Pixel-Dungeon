blast.death_bomb.desc=قنبلة على غرار قنابل تينغو تُقذف نحو البطل عندما يموت عدو بانفجار مهووس القنابل دون إسقاط غنائم. تعد تنازليًا 3، 2، 1 وتلحق الضرر بالشخصيات ضمن مسافة مربعين. لا يمكن التقاطها.
