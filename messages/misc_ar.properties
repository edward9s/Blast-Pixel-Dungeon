blast.remote_bomb.last_slot=السعة القصوى للقنابل الآن 1. يتوقف الرمي المؤقت حتى تدمج قنبلة أخرى، ويعود وضع التحكم عن بُعد بعد زوال جميع القنابل المشتعلة.
