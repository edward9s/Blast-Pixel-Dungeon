blast.remote_bomb.buff_name=Controllo bombe
blast.remote_bomb.buff_desc=Tieni premuto il pulsante delle bombe in basso per passare dalla modalità remota a quella a tempo, ma solo se non ci sono bombe accese su questo piano. Modalità remota: piazza istantaneamente bombe ai tuoi piedi senza consumare turni e fai esplodere la più vecchia con il pulsante in basso. Modalità a tempo: mira e lancia bombe consumando 1 turno; esploderanno automaticamente. Il pulsante in basso mostra il conto alla rovescia più breve al posto del cuore. La modalità scelta rimane dopo il salvataggio e la resurrezione. Ogni lancio a tempo richiede almeno 2 slot e riduce permanentemente la capacità massima di 1; l'ultimo resta per le bombe remote. Il test delle bombe infinite annulla questi limiti. Con capacità 1, la modalità remota torna quando non ci sono più bombe accese.
blast.remote_bomb.detonate=Detona bomba remota (tieni premuto: cambia)
blast.settings.infinite_bomb=Test: bombe infinite
blast.bomb_maniac.buff_name=Maniaco delle bombe
blast.bomb_maniac.buff_desc=Premi il pulsante sul bordo dello schermo per piazzare una bomba remota ai tuoi piedi senza consumare turni oppure per mirare e lanciare una bomba a tempo consumando un turno, secondo la modalità. Massimo piazzate: %s. Disponibili: %s. Tieni premuto per scegliere o infondere bombe. Le esplosioni liberano gli spazi occupati. Le bombe spente recuperate possono essere infuse per recuperare gli spazi occupati. Ogni lancio a tempo richiede almeno 2 slot e riduce permanentemente la capacità massima di 1; l'ultimo resta per le bombe remote. Il test delle bombe infinite annulla questi limiti. Con capacità 1, la modalità remota torna quando non ci sono più bombe accese.
blast.bomb_maniac.window_title=Maniaco delle bombe
blast.bomb_maniac.capacity=Capacità: %s / Disponibili: %s
blast.bomb_maniac.imbue=Infondi bomba
blast.bomb_maniac.imbue_prompt=Scegli una bomba da infondere
blast.bomb_maniac.throw=Piazza bomba (tieni premuto: imposta)
blast.bomb_maniac.no_charges=Non ci sono bombe disponibili finché una non esplode o non viene infusa una bomba spenta recuperata.
blast.bomb_maniac.blocked=Non puoi piazzare qui una bomba accesa.
blast.bomb.lit_pickup=Non puoi raccogliere bombe accese.
blast.free_movement.buff_name=Attraversamento ostacoli
blast.free_movement.buff_desc=Puoi attraversare muri, porte chiuse a chiave e bombe accese. Restano %s turni. Durante l'effetto, le bombe lanciate dall'inventario e quelle calciate dai mostri rari attraversano il terreno e i personaggi prima di atterrare.
blast.radius.buff_name=Esplosioni ampliate
blast.radius.buff_desc=Tutte le bombe hanno un raggio di esplosione aumentato di %s. I normali ritrovamenti concedono al massimo +1.
blast.indestructible.buff_name=Immunità alle bombe
blast.indestructible.buff_desc=Immune ai danni delle esplosioni delle bombe per altri %s turni.
blast.radius_pickup.name=Potenziamento dell'esplosione di fuoco
blast.radius_pickup.desc=Raccogliendolo, aumenta subito di 1 il raggio di esplosione di tutte le bombe (limite normale +1). Se hai già l'effetto, ogni ulteriore raccolta dà 10 monete d'oro. Se l'oggetto viene distrutto dal fuoco o da un'esplosione, compaiono fino a 8 mostri nelle vicinanze con adrenalina per 1.000.000 di turni.
blast.haste_pickup.name=Stivali della velocità
blast.haste_pickup.desc=Raccogliendoli, ottieni subito l'effetto di una Pozione di Rapidità (velocità di movimento triplicata per 20 turni), senza bere alcuna pozione. Se la Rapidità è già attiva, la durata aumenta di 20 turni invece di ricevere oro. Se vengono distrutti dal fuoco o da un'esplosione, compaiono fino a 8 mostri vicini con adrenalina per 1.000.000 di turni.
blast.phase_potion.name=Pozione di attraversamento
blast.phase_potion.desc=Bevila per attraversare muri, porte chiuse a chiave e bombe accese per 6 turni. Anche le bombe lanciate dall'inventario e calciate dai mostri rari attraversano ostacoli e personaggi.
blast.bombproof_scroll.name=Pergamena di protezione dalle bombe
blast.bombproof_scroll.desc=Leggila per diventare immune ai danni delle esplosioni delle bombe per 6 turni.
blast.rubble.name=Macerie
blast.rubble.desc=Detriti di roccia provocati da una bomba. Bloccano il passaggio, ma un'altra esplosione può rimuoverli.
blast.remote_bomb.timed_mode=Modalità a tempo (tieni premuto: cambia)
blast.remote_bomb.capacity_required=Per lanciare bombe a tempo serve una capacità massima di almeno 2. L'ultimo slot resta riservato alle bombe remote. Il test delle bombe infinite rimuove questo limite.
blast.remote_bomb.last_slot=La capacità massima è scesa a 1. Infondi un'altra bomba per poter eseguire altri lanci a tempo. Quando non restano bombe accese, torna automaticamente la modalità remota.
blast.remote_bomb.switch_blocked=Non puoi cambiare modalità finché ci sono bombe accese su questo piano.
blast.remote_bomb.timed_enabled=Modalità a tempo attivata.
blast.remote_bomb.remote_enabled=Modalità remota attivata.
blast.bomb_maniac.remote_throw=Lancio remoto (tieni premuto: imposta)
blast.bomb_maniac.timed_throw=Lancio a tempo (tieni premuto: imposta)
blast.bomb_maniac.aim=Scegli dove lanciare
blast.death_bomb.name=Bomba di contrattacco mortale
blast.death_bomb.desc=Una bomba simile a quelle di Tengu, lanciata verso l'eroe quando un nemico muore per l'esplosione di una bomba del Maniaco delle bombe senza lasciare bottino. Conta 3, 2, 1 e danneggia i personaggi entro due caselle. Non può essere raccolta.
blast.death_bomb.cant_pickup=Non puoi raccogliere le bombe di contrattacco dei nemici.
blast.death_bomb.ondeath=Sei stato ucciso da una bomba di contrattacco mortale.
