blast.settings.indestructible_test_desc=Il test di immunità alle bombe è attivo. Non subirai danni dalle esplosioni delle bombe finché l'opzione non verrà disattivata.
blast.settings.free_movement_test_desc=Il test di attraversamento degli ostacoli è attivo. Puoi attraversare gli ostacoli consentiti finché l'opzione non verrà disattivata.
blast.settings.remote_throw_test_desc=Il test di lancio a distanza è attivo. In modalità remota puoi mirare e lanciare una bomba controllabile senza consumare un turno, poi farla esplodere con il pulsante remoto.
