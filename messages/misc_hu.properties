blast.remote_bomb.buff_name=Bombavezérlés
blast.remote_bomb.buff_desc=Tartsd lenyomva az alsó bombagombot a távirányított és az időzített mód közötti váltáshoz, ha nincs meggyújtott bomba ezen a szinten. Távirányított módban kör felhasználása nélkül helyezhetsz bombát magad alá, az alsó gombbal pedig a legrégebbit robbanthatod fel. Időzített módban 1 körbe kerül a célzás és a dobás, majd a bomba automatikusan felrobban. Az alsó gomb a szív helyett a legrövidebb hátralévő időt mutatja. A mód mentés és feltámadás után is megmarad. Az időzített dobáshoz legalább 2 kapacitás kell, és minden dobás végleg 1-gyel csökkenti a maximumot; az utolsó hely a távirányított bombáké. A végtelen bombák tesztje feloldja ezeket a korlátokat. Ha a kapacitás 1, a meggyújtott bombák eltűnése után visszatér a távirányított mód.
blast.remote_bomb.detonate=Távoli robbantás (hosszan: váltás)
blast.settings.infinite_bomb=Teszt: végtelen bomba
blast.bomb_maniac.buff_name=Bombamániás
blast.bomb_maniac.buff_desc=Nyomd meg a képernyő szélén lévő gombot, hogy távirányított módban kör nélkül bombát helyezz magad alá, vagy időzített módban 1 körért célzottan eldobd. Maximum elhelyezve: %s. Elérhető: %s. Tartsd lenyomva a bombák kiválasztásához vagy feláldozásához. Robbanás után felszabadulnak a foglalt helyek. A begyűjtött, kialudt bombák feláldozhatók a foglalt helyek visszaszerzésére. Az időzített dobáshoz legalább 2 kapacitás kell, és minden dobás végleg 1-gyel csökkenti a maximumot; az utolsó hely a távirányított bombáké. A végtelen bombák tesztje feloldja ezeket a korlátokat. Ha a kapacitás 1, a meggyújtott bombák eltűnése után visszatér a távirányított mód.
blast.bomb_maniac.window_title=Bombamániás
blast.bomb_maniac.capacity=Kapacitás: %s / Elérhető: %s
blast.bomb_maniac.imbue=Bomba feláldozása
blast.bomb_maniac.imbue_prompt=Válassz feláldozandó bombát
blast.bomb_maniac.throw=Bomba lerakása (hosszan: beállítás)
blast.bomb_maniac.no_charges=Nincs elérhető bomba. Várd meg, míg egy felrobban, vagy áldozz fel egy begyűjtött, kialudt bombát.
blast.bomb_maniac.blocked=Ide nem helyezhető meggyújtott bomba.
blast.bomb.lit_pickup=Meggyújtott bomba nem vehető fel.
blast.free_movement.buff_name=Áthaladás akadályokon
blast.free_movement.buff_desc=Áthaladhatsz falakon, bezárt ajtókon és meggyújtott bombákon. Hátralévő idő: %s kör. A hatás alatt a felszerelésből dobott és a ritka szörnyek által elrúgott bombák áthaladnak a terepen és a szereplőkön, mielőtt földet érnek.
blast.radius.buff_name=Nagyobb robbanások
blast.radius.buff_desc=Minden bomba robbanási sugara +%s értékkel nő. Normál felvétellel legfeljebb +1 szerezhető.
blast.indestructible.buff_name=Bombavédelem
blast.indestructible.buff_desc=Még %s körig immunis vagy a bombarobbanások sebzésére.
blast.radius_pickup.name=Tűzrobbanás-fejlesztés
blast.radius_pickup.desc=Felvételkor minden bomba robbanási sugara azonnal 1-gyel nő (normál felvétel felső határa +1). Ha a hatás már aktív, a következő felvétel 10 aranyat ad. Ha a tárgyat tűz vagy robbanás pusztítja el, legfeljebb 8 szörny jelenik meg a közelben, 1 000 000 környi adrenalinnal.
blast.haste_pickup.name=Sebességcsizma
blast.haste_pickup.desc=Felvételkor azonnal megkapod a gyorsaságital hatását (háromszoros mozgási sebesség 20 körig), ivás nélkül. Ha már aktív, 20 körrel meghosszabbítja a hatást arany helyett. Tűz vagy robbanás általi megsemmisülése esetén legfeljebb 8 szörny jelenik meg a közelben 1 000 000 környi adrenalinnal.
blast.phase_potion.name=Áthatolás itala
blast.phase_potion.desc=Megivása után 6 körig áthaladhatsz falakon, bezárt ajtókon és meggyújtott bombákon. A felszerelésből dobott és ritka szörnyek által elrúgott bombák az akadályokon és szereplőkön is áthaladnak.
blast.bombproof_scroll.name=Bombavédő tekercs
blast.bombproof_scroll.desc=Elolvasása után 6 körig immunis leszel a bombarobbanások sebzésére.
blast.rubble.name=Törmelék
blast.rubble.desc=Bomba által ledöntött kőtörmelék. Elzárja az utat, de egy újabb robbanás eltávolítja.
blast.remote_bomb.timed_mode=Időzített mód (hosszan: váltás)
blast.remote_bomb.capacity_required=Az időzített bombadobáshoz legalább 2 maximális bombahely szükséges. Az utolsó hely a távirányított bombáké. A végtelen bombák tesztje feloldja ezt a korlátot.
blast.remote_bomb.last_slot=A maximális kapacitás 1-re csökkent. Újabb időzített dobáshoz áldozz fel egy bombát. Ha már nincs meggyújtott bomba, automatikusan visszatér a távirányított mód.
blast.remote_bomb.switch_blocked=Nem válthatsz módot, amíg meggyújtott bomba van ezen a szinten.
blast.remote_bomb.timed_enabled=Időzített mód bekapcsolva.
blast.remote_bomb.remote_enabled=Távirányított mód bekapcsolva.
blast.bomb_maniac.remote_throw=Távoli dobás (hosszan: beállítás)
blast.bomb_maniac.timed_throw=Időzített dobás (hosszan: beállítás)
blast.bomb_maniac.aim=Válassz dobási helyet
blast.death_bomb.name=Halálos válaszbomba
blast.death_bomb.desc=Tengu-féle bomba, amelyet a hős felé dobnak, ha egy ellenség a Bombamániás robbanásától hal meg, és nem hagy zsákmányt. 3, 2, 1 visszaszámlálás után megsebzi a két mezőn belül álló szereplőket. Nem vehető fel.
blast.death_bomb.cant_pickup=Az ellenséges válaszbombák nem vehetők fel.
blast.death_bomb.ondeath=Halálos válaszbomba ölt meg.
