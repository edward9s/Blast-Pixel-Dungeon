blast.settings.indestructible_test_desc=A bombavédelmi teszt aktív. A bombarobbanások nem sebeznek, amíg ki nem kapcsolod ezt a beállítást.
blast.settings.free_movement_test_desc=Az akadályokon áthaladás tesztje aktív. A beállítás kikapcsolásáig áthaladhatsz a támogatott akadályokon.
blast.settings.remote_throw_test_desc=A távoli dobás tesztje aktív. Távirányított módban kör felhasználása nélkül célzottan dobhatsz egy vezérelhető bombát, majd a távoli gombbal felrobbanthatod.
