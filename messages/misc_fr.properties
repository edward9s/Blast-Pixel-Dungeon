blast.remote_bomb.buff_name=Commande des bombes
blast.remote_bomb.buff_desc=Maintenez le bouton de bombe du bas pour passer du mode télécommandé au mode retardé, à condition qu'aucune bombe allumée ne se trouve à cet étage. En mode télécommandé, placez immédiatement une bombe à vos pieds sans dépenser de tour, puis utilisez le bouton du bas pour faire exploser la plus ancienne. En mode retardé, visez et lancez une bombe en dépensant 1 tour ; elle explosera automatiquement. Le bouton du bas affiche le plus court temps restant à la place du cœur. Le mode choisi est conservé après sauvegarde et résurrection. Chaque lancer retardé nécessite au moins 2 emplacements et réduit définitivement la capacité maximale de 1 ; le dernier reste réservé aux bombes télécommandées. Le test de bombes infinies supprime ces limites. Avec une capacité de 1, le mode télécommandé revient quand aucune bombe n'est allumée.
blast.remote_bomb.detonate=Faire exploser (maintenir : changer)
blast.settings.infinite_bomb=Test : bombes infinies
blast.bomb_maniac.buff_name=Maniaque des bombes
blast.bomb_maniac.buff_desc=Appuyez sur le bouton au bord de l'écran pour poser une bombe télécommandée à vos pieds sans dépenser de tour, ou pour viser et lancer une bombe retardée en dépensant un tour, selon le mode. Maximum en place : %s. Disponibles : %s. Maintenez le bouton pour sélectionner ou imprégner des bombes. Les explosions libèrent les emplacements occupés. Les bombes éteintes récupérées peuvent être imprégnées pour récupérer des emplacements occupés. Chaque lancer retardé nécessite au moins 2 emplacements et réduit définitivement la capacité maximale de 1 ; le dernier reste réservé aux bombes télécommandées. Le test de bombes infinies supprime ces limites. Avec une capacité de 1, le mode télécommandé revient quand aucune bombe n'est allumée.
blast.bomb_maniac.window_title=Maniaque des bombes
blast.bomb_maniac.capacity=Capacité : %s / Disponibles : %s
blast.bomb_maniac.imbue=Imprégner une bombe
blast.bomb_maniac.imbue_prompt=Choisissez une bombe à imprégner
blast.bomb_maniac.throw=Poser une bombe (maintenir : régler)
blast.bomb_maniac.no_charges=Aucune bombe disponible avant qu'une bombe explose ou qu'une bombe éteinte récupérée soit imprégnée.
blast.bomb_maniac.blocked=Impossible de placer une bombe allumée ici.
blast.bomb.lit_pickup=Impossible de ramasser une bombe allumée.
blast.free_movement.buff_name=Traversée des obstacles
blast.free_movement.buff_desc=Permet de traverser les murs, les portes verrouillées et les bombes allumées. Encore %s tours. Pendant cet effet, les bombes lancées depuis l'inventaire ou frappées du pied par les monstres rares traversent le terrain et les personnages avant d'atterrir.
blast.radius.buff_name=Explosions étendues
blast.radius.buff_desc=Le rayon d'explosion de toutes les bombes augmente de %s. Les ramassages normaux accordent au maximum +1.
blast.indestructible.buff_name=Immunité aux bombes
blast.indestructible.buff_desc=Immunité aux dégâts des explosions de bombes pendant encore %s tours.
blast.radius_pickup.name=Amélioration des explosions de feu
blast.radius_pickup.desc=Ramasser cet objet augmente immédiatement de 1 le rayon d'explosion de toutes les bombes (maximum +1 par ramassage normal). Si vous avez déjà cet effet, chaque exemplaire supplémentaire rapporte 10 pièces d'or. Si cet objet est détruit par le feu ou une explosion, jusqu'à 8 monstres apparaissent à proximité avec 1 000 000 de tours d'adrénaline.
blast.haste_pickup.name=Bottes de vitesse
blast.haste_pickup.desc=Le ramassage confère immédiatement l'effet d'une potion de rapidité (vitesse de déplacement triplée pendant 20 tours), sans boire de potion. Si l'effet est déjà actif, sa durée est prolongée de 20 tours au lieu de recevoir de l'or. Si cet objet est détruit par le feu ou une explosion, jusqu'à 8 monstres apparaissent à proximité avec 1 000 000 de tours d'adrénaline.
blast.phase_potion.name=Potion de traversée des obstacles
blast.phase_potion.desc=À boire pour traverser les murs, les portes verrouillées et les bombes allumées pendant 6 tours. Les bombes lancées depuis l'inventaire et celles frappées du pied par les monstres rares traversent aussi les obstacles et les personnages.
blast.bombproof_scroll.name=Parchemin de protection contre les bombes
blast.bombproof_scroll.desc=À lire pour devenir immunisé contre les dégâts des explosions de bombes pendant 6 tours.
blast.rubble.name=Décombres
blast.rubble.desc=Débris de roche provoqués par une bombe. Ils bloquent le passage, mais une nouvelle explosion peut les détruire.
blast.remote_bomb.timed_mode=Mode retardé (maintenir : changer)
blast.remote_bomb.capacity_required=Les lancers de bombes retardées exigent une capacité maximale d'au moins 2. Le dernier emplacement est réservé aux bombes télécommandées. Le test de bombes infinies lève cette restriction.
blast.remote_bomb.last_slot=La capacité maximale est tombée à 1. Imprégnez une autre bombe pour pouvoir relancer des bombes retardées. Le mode télécommandé revient automatiquement une fois toutes les bombes allumées disparues.
blast.remote_bomb.switch_blocked=Impossible de changer de mode tant qu'une bombe est allumée à cet étage.
blast.remote_bomb.timed_enabled=Mode retardé activé.
blast.remote_bomb.remote_enabled=Mode télécommandé activé.
blast.bomb_maniac.remote_throw=Lancer à distance (maintenir : régler)
blast.bomb_maniac.timed_throw=Lancer retardé (maintenir : régler)
blast.bomb_maniac.aim=Choisissez une cible
blast.death_bomb.name=Bombe de riposte mortelle
blast.death_bomb.desc=Une bombe de type Tengu lancée vers le héros lorsqu'un ennemi meurt dans l'explosion d'une bombe du Maniaque des bombes sans laisser de butin. Elle décompte 3, 2, 1, puis blesse les personnages situés à deux cases ou moins. Elle ne peut pas être ramassée.
blast.death_bomb.cant_pickup=Impossible de ramasser les bombes de riposte ennemies.
blast.death_bomb.ondeath=Vous avez été tué par une bombe de riposte mortelle.
