blast.settings.indestructible_test_desc=Test odporności na bomby jest aktywny. Obrażenia od wybuchów bomb są blokowane do czasu wyłączenia tej opcji.
blast.settings.free_movement_test_desc=Test przenikania przez przeszkody jest aktywny. Możesz przechodzić przez obsługiwane przeszkody do czasu wyłączenia tej opcji.
blast.settings.remote_throw_test_desc=Test zdalnego rzutu jest aktywny. W trybie zdalnym możesz bez zużycia tury wycelować i rzucić sterowaną bombę, a następnie zdetonować ją przyciskiem zdalnym.
