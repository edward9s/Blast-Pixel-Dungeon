blast.save_transfer.permission=Zezwól na zarządzanie plikami i spróbuj ponownie.
blast.remote_bomb.buff_name=Sterowanie bombami
blast.remote_bomb.buff_desc=Przytrzymaj dolny przycisk bomby, aby przełączać się między trybem zdalnym a czasowym, o ile na piętrze nie ma zapalonych bomb. Tryb zdalny: natychmiast stawiaj bomby pod stopami bez zużywania tury i detonuj najstarszą dolnym przyciskiem. Tryb czasowy: wyceluj i rzuć bombę za 1 turę; wybuchnie automatycznie. Dolny przycisk pokazuje najkrótszy pozostały czas zamiast serca. Wybrany tryb zostaje zachowany po zapisaniu gry i wskrzeszeniu. Każdy rzut bombą czasową wymaga pojemności co najmniej 2 i trwale zmniejsza jej maksimum o 1; ostatnie miejsce pozostaje dla bomb zdalnych. Test nieskończonych bomb znosi te ograniczenia. Przy pojemności 1 tryb zdalny powraca, gdy na piętrze nie ma już zapalonych bomb.
blast.remote_bomb.detonate=Zdetonuj bombę (przytrzymaj: zmień)
blast.settings.infinite_bomb=Test: nieskończone bomby
blast.bomb_maniac.buff_name=Maniak bomb
blast.bomb_maniac.buff_desc=Naciśnij przycisk przy krawędzi ekranu, aby w trybie zdalnym postawić bombę pod stopami bez zużycia tury albo w trybie czasowym wycelować i rzucić bombę za 1 turę. Maksymalnie rozstawionych: %s. Dostępnych: %s. Przytrzymaj, aby wybrać lub nasycić bomby. Wybuchy zwalniają zajęte miejsca. Zebrane, zgaszone bomby można nasycić, aby odzyskać zajęte miejsca. Każdy rzut bombą czasową wymaga pojemności co najmniej 2 i trwale zmniejsza jej maksimum o 1; ostatnie miejsce pozostaje dla bomb zdalnych. Test nieskończonych bomb znosi te ograniczenia. Przy pojemności 1 tryb zdalny powraca, gdy na piętrze nie ma już zapalonych bomb.
blast.bomb_maniac.window_title=Maniak bomb
blast.bomb_maniac.capacity=Pojemność: %s / Dostępne: %s
blast.bomb_maniac.imbue=Nasyć bombę
blast.bomb_maniac.imbue_prompt=Wybierz bombę do nasycenia
blast.bomb_maniac.throw=Postaw bombę (przytrzymaj: ustaw)
blast.bomb_maniac.no_charges=Brak dostępnych bomb. Zaczekaj na wybuch jednej z nich lub nasyć zebraną, zgaszoną bombę.
blast.bomb_maniac.blocked=Nie można tu postawić zapalonej bomby.
blast.bomb.lit_pickup=Nie można podnosić zapalonych bomb.
blast.free_movement.buff_name=Przenikanie przez ściany
blast.free_movement.buff_desc=Możesz przechodzić przez ściany, zamknięte na klucz drzwi i zapalone bomby. Pozostało %s tur. Podczas działania efektu bomby rzucone z ekwipunku oraz kopnięte przez rzadkie potwory przenikają przez teren i postacie, zanim wylądują.
blast.radius.buff_name=Większy zasięg wybuchu
blast.radius.buff_desc=Zasięg wybuchu wszystkich bomb zwiększa się o %s. Zwykłe podnoszenie daje najwyżej +1.
blast.indestructible.buff_name=Odporność na bomby
blast.indestructible.buff_desc=Jeszcze przez %s tur nie otrzymujesz obrażeń od wybuchów bomb.
blast.radius_pickup.name=Ulepszenie ognistej eksplozji
blast.radius_pickup.desc=Podniesienie natychmiast zwiększa zasięg wybuchu wszystkich bomb o 1 (zwykły limit +1). Jeśli efekt już działa, kolejne podniesienie daje 10 złota. Po zniszczeniu przedmiotu przez ogień lub wybuch w pobliżu pojawia się do 8 potworów z adrenaliną na 1 000 000 tur.
blast.haste_pickup.name=Buty szybkości
blast.haste_pickup.desc=Podniesienie natychmiast daje efekt mikstury przyspieszenia (trzykrotnie większa prędkość ruchu przez 20 tur), bez jej wypijania. Jeśli efekt już działa, czas trwania wydłuża się o 20 tur zamiast przyznania złota. Po zniszczeniu przez ogień lub wybuch w pobliżu pojawia się do 8 potworów z adrenaliną na 1 000 000 tur.
blast.phase_potion.name=Mikstura przenikania
blast.phase_potion.desc=Wypij, aby przez 6 tur przenikać przez ściany, zamknięte drzwi i zapalone bomby. Bomby z ekwipunku i kopnięte przez rzadkie potwory przenikają przez przeszkody oraz postacie.
blast.bombproof_scroll.name=Zwój ochrony przed bombami
blast.bombproof_scroll.desc=Przeczytaj, aby przez 6 tur uzyskać odporność na obrażenia od wybuchów bomb.
blast.rubble.name=Gruzy
blast.rubble.desc=Odłamki skał powstałe po wybuchu bomby. Blokują przejście, ale kolejny wybuch może je usunąć.
blast.remote_bomb.timed_mode=Tryb czasowy (przytrzymaj: zmień)
blast.remote_bomb.capacity_required=Rzucanie bomb czasowych wymaga maksymalnej pojemności co najmniej 2. Ostatnie miejsce jest zarezerwowane dla bomb zdalnych. Test nieskończonych bomb znosi ten limit.
blast.remote_bomb.last_slot=Maksymalna pojemność spadła do 1. Nasyć kolejną bombę, aby znów rzucać bombami czasowymi. Gdy znikną wszystkie zapalone bomby, automatycznie powróci tryb zdalny.
blast.remote_bomb.switch_blocked=Nie można zmienić trybu, dopóki na piętrze jest zapalona bomba.
blast.remote_bomb.timed_enabled=Tryb czasowy włączony.
blast.remote_bomb.remote_enabled=Tryb zdalny włączony.
blast.bomb_maniac.remote_throw=Zdalny rzut (przytrzymaj: ustaw)
blast.bomb_maniac.timed_throw=Rzut bombą czasową (przytrzymaj: ustaw)
blast.bomb_maniac.aim=Wybierz miejsce rzutu
blast.death_bomb.name=Pośmiertna bomba odwetowa
blast.death_bomb.desc=Bomba w stylu Tengu rzucana w stronę bohatera, gdy wróg ginie od wybuchu bomby Maniaka bomb i nie zostawia łupu. Odlicza 3, 2, 1, po czym rani postacie w promieniu dwóch pól. Nie można jej podnieść.
blast.death_bomb.cant_pickup=Nie można podnosić wrogich bomb odwetowych.
blast.death_bomb.ondeath=Zabiła cię pośmiertna bomba odwetowa.
