blast.remote_bomb.buff_name=Regado de bomboj
blast.remote_bomb.buff_desc=Tenu premata la malsupran bombobutonon por ŝanĝi inter fora kaj tempigita reĝimo, kiam neniu brulanta bombo restas en ĉi tiu etaĝo. Fora reĝimo: metu bombon ĉe viaj piedoj sen elspezi vicon kaj eksplodigu la plej malnovan per la malsupra butono. Tempigita reĝimo: celu kaj ĵetu bombon kontraŭ 1 vico; ĝi eksplodos aŭtomate. La malsupra butono montras la plej mallongan restantan tempon anstataŭ la koro. La elektita reĝimo restas post konservado kaj reviviĝo. Tempigita ĵeto postulas kapaciton de almenaŭ 2 kaj konstante malpliigas la maksimumon je 1. La lasta loko restas por fora reĝimo. La testo de senfinaj bomboj forigas tiujn limojn. Ĉe kapacito 1, fora reĝimo aŭtomate revenas kiam ĉiuj brulantaj bomboj malaperas.
blast.remote_bomb.detonate=Eksplodigi bombon (teni: ŝanĝi)
blast.settings.infinite_bomb=Testo: senfinaj bomboj
blast.bomb_maniac.buff_name=Bombomaniulo
blast.bomb_maniac.buff_desc=Premu la butonon ĉe la rando de la ekrano por meti foran bombon ĉe viaj piedoj sen elspezi vicon, aŭ celi kaj ĵeti tempigitan bombon kontraŭ 1 vico, laŭ la reĝimo. Maksimumo metitaj: %s. Haveblaj: %s. Tenu premata por elekti aŭ ensorbi bombojn. Eksplodoj liberigas okupitajn lokojn. Kolektitaj estingitaj bomboj povas esti ensorbitaj por reakiri okupitajn lokojn. Tempigita ĵeto postulas kapaciton de almenaŭ 2 kaj konstante malpliigas la maksimumon je 1. La lasta loko restas por fora reĝimo. La testo de senfinaj bomboj forigas tiujn limojn. Ĉe kapacito 1, fora reĝimo aŭtomate revenas kiam ĉiuj brulantaj bomboj malaperas.
blast.bomb_maniac.window_title=Bombomaniulo
blast.bomb_maniac.capacity=Kapacito: %s / Haveblaj: %s
blast.bomb_maniac.imbue=Ensorbi bombon
blast.bomb_maniac.imbue_prompt=Elektu bombon por ensorbi
blast.bomb_maniac.throw=Meti bombon (teni: agordi)
blast.bomb_maniac.no_charges=Neniuj bomboj haveblas ĝis unu eksplodos aŭ kolektita estingita bombo estos ensorbita.
blast.bomb_maniac.blocked=Ne eblas meti ekbruligitan bombon ĉi tie.
blast.bomb.lit_pickup=Ekbruligitaj bomboj ne estas kolekteblaj.
blast.free_movement.buff_name=Trairado de obstakloj
blast.free_movement.buff_desc=Vi povas trairi murojn, ŝlositajn pordojn kaj ekbruligitajn bombojn. Restas %s vicoj. Dum la efiko, bomboj ĵetitaj el la inventaro kaj bomboj piedbatitaj de raraj monstroj trapasas terenon kaj rolulojn antaŭ ol alteriĝi.
blast.radius.buff_name=Pli grandaj eksplodoj
blast.radius.buff_desc=La eksploda radiuso de ĉiuj bomboj kreskas je %s. Ordinara kolektado donas maksimume +1.
blast.indestructible.buff_name=Imuneco kontraŭ bomboj
blast.indestructible.buff_desc=Vi estas imuna kontraŭ damaĝo pro bombeksplodoj dum pliaj %s vicoj.
blast.radius_pickup.name=Plibonigo de fajraj eksplodoj
blast.radius_pickup.desc=Kolektado tuj pliigas la eksplodan radiuson de ĉiuj bomboj je 1 (ordinara limo +1). Se vi jam havas la efikon, ĉiu plia kolekto donas 10 ormonerojn. Se fajro aŭ eksplodo detruas la objekton, ĝis 8 monstroj aperas apude kun adrenalino dum 1 000 000 vicoj.
blast.haste_pickup.name=Rapidecaj botoj
blast.haste_pickup.desc=Kolektado tuj donas la efikon de rapideca pocio (triobla movrapideco dum 20 vicoj), sen trinkado. Se la efiko jam aktivas, ĝi daŭras 20 pliajn vicojn anstataŭ doni oron. Se fajro aŭ eksplodo detruas la objekton, ĝis 8 monstroj aperas apude kun adrenalino dum 1 000 000 vicoj.
blast.phase_potion.name=Pocio por trairi obstaklojn
blast.phase_potion.desc=Trinku por trairi murojn, ŝlositajn pordojn kaj ekbruligitajn bombojn dum 6 vicoj. Bomboj ĵetitaj el la inventaro kaj piedbatitaj de raraj monstroj ankaŭ trapasas obstaklojn kaj rolulojn.
blast.bombproof_scroll.name=Volvaĵo de bomboprotekto
blast.bombproof_scroll.desc=Legu por fariĝi imuna kontraŭ damaĝo pro bombeksplodoj dum 6 vicoj.
blast.rubble.name=Rubaĵoj
blast.rubble.desc=Ŝtonaj restaĵoj pro bombo. Ili baras la vojon sed alia eksplodo povas forigi ilin.
blast.remote_bomb.timed_mode=Tempigita reĝimo (teni: ŝanĝi)
blast.remote_bomb.capacity_required=Tempigitaj ĵetoj postulas maksimuman kapaciton de almenaŭ 2 bomboj. La lasta loko estas rezervita por foraj bomboj. La testo de senfinaj bomboj forigas tiun limon.
blast.remote_bomb.last_slot=La maksimuma kapacito nun estas 1. Por ĵeti pliajn tempigitajn bombojn, ensorbu alian bombon. Kiam neniu brulanta bombo restos, fora reĝimo aŭtomate revenos.
blast.remote_bomb.switch_blocked=Ne eblas ŝanĝi reĝimon dum ekbruligita bombo restas en ĉi tiu etaĝo.
blast.remote_bomb.timed_enabled=Tempigita reĝimo ŝaltita.
blast.remote_bomb.remote_enabled=Fora reĝimo ŝaltita.
