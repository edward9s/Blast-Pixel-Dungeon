blast.bomb_maniac.timed_throw=Tempigita ĵetado (teni: agordi)
blast.bomb_maniac.aim=Elektu ĵetlokon
blast.death_bomb.name=Mortiga kontraŭataka bombo
blast.death_bomb.desc=Tengu-stila bombo ĵetata al la heroo kiam malamiko mortas pro eksplodo de Bombomaniulo sen faligi rabaĵon. Ĝi kalkulas 3, 2, 1 kaj damaĝas rolulojn ene de du kaheloj. Ĝi ne estas kolektebla.
blast.death_bomb.cant_pickup=Malamikaj kontraŭatakaj bomboj ne estas kolekteblaj.
blast.death_bomb.ondeath=Mortiga kontraŭataka bombo mortigis vin.
