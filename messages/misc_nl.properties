blast.remote_bomb.buff_name=Bommenbesturing
blast.remote_bomb.buff_desc=Houd de onderste bomknop ingedrukt om te wisselen tussen afstandsbediening en tijdmodus. Dat kan alleen als er geen brandende bommen op deze verdieping liggen. Afstandsmodus: plaats onmiddellijk een bom onder je voeten zonder een beurt te verbruiken en laat met de onderste knop de oudste ontploffen. Tijdmodus: mik en gooi een bom in 1 beurt; die ontploft automatisch. De onderste knop toont de kortste resterende tijd in plaats van het hart. De gekozen modus blijft bewaard na opslaan en herleven. Elke tijdbomworp vereist minstens 2 plaatsen en verlaagt de maximale capaciteit blijvend met 1; de laatste plek blijft voor afstandsbommen. De test met oneindige bommen heft deze beperkingen op. Bij capaciteit 1 keert de afstandsmodus terug zodra alle brandende bommen verdwenen zijn.
blast.remote_bomb.detonate=Bom laten ontploffen (ingedrukt: wisselen)
blast.settings.infinite_bomb=Test: oneindige bommen
blast.bomb_maniac.buff_name=Bommenmaniak
blast.bomb_maniac.buff_desc=Druk op de knop aan de schermrand om in de afstandsmodus zonder beurtverlies een bom onder je voeten te plaatsen, of om in de tijdmodus een bom gericht te gooien voor 1 beurt. Maximum geplaatst: %s. Beschikbaar: %s. Houd ingedrukt om bommen te kiezen of op te offeren. Explosies geven bezette plaatsen terug. Teruggevonden gedoofde bommen kunnen worden opgeofferd om bezette plaatsen vrij te maken. Elke tijdbomworp vereist minstens 2 plaatsen en verlaagt de maximale capaciteit blijvend met 1; de laatste plek blijft voor afstandsbommen. De test met oneindige bommen heft deze beperkingen op. Bij capaciteit 1 keert de afstandsmodus terug zodra alle brandende bommen verdwenen zijn.
blast.bomb_maniac.window_title=Bommenmaniak
blast.bomb_maniac.capacity=Capaciteit: %s / Beschikbaar: %s
blast.bomb_maniac.imbue=Bom opofferen
blast.bomb_maniac.imbue_prompt=Kies een bom om op te offeren
blast.bomb_maniac.throw=Bom plaatsen (ingedrukt: instellen)
blast.bomb_maniac.no_charges=Er zijn geen bommen beschikbaar totdat er een ontploft of een teruggevonden gedoofde bom is opgeofferd.
blast.bomb_maniac.blocked=Hier kun je geen aangestoken bom plaatsen.
blast.bomb.lit_pickup=Aangestoken bommen kun je niet oppakken.
blast.free_movement.buff_name=Door muren bewegen
blast.free_movement.buff_desc=Je kunt door muren, afgesloten deuren en aangestoken bommen bewegen. Nog %s beurten. Tijdens dit effect vliegen bommen uit je inventaris en door zeldzame monsters geschopte bommen door terrein en personages voordat ze landen.
blast.radius.buff_name=Grotere explosies
blast.radius.buff_desc=Alle bommen krijgen +%s explosieradius. Normale vondsten geven maximaal +1.
blast.indestructible.buff_name=Bommenbestendig
blast.indestructible.buff_desc=Nog %s beurten immuun voor schade door bomexplosies.
blast.radius_pickup.name=Verbetering van vuurexplosies
blast.radius_pickup.desc=Bij oppakken wordt de explosieradius van alle bommen meteen 1 groter (normale bovengrens +1). Als het effect al actief is, levert elk extra exemplaar 10 goud op. Wordt dit voorwerp vernietigd door vuur of een explosie, dan verschijnen maximaal 8 monsters in de buurt met adrenaline voor 1.000.000 beurten.
blast.haste_pickup.name=Snelheidslaarzen
blast.haste_pickup.desc=Bij oppakken krijg je onmiddellijk het effect van een drank van haast (driemaal zo snel bewegen gedurende 20 beurten), zonder een drank te drinken. Als haast al actief is, duurt het effect 20 beurten langer in plaats van goud op te leveren. Bij vernietiging door vuur of een explosie verschijnen maximaal 8 monsters met adrenaline voor 1.000.000 beurten.
blast.phase_potion.name=Drank om door muren te gaan
blast.phase_potion.desc=Drink deze om 6 beurten lang door muren, gesloten deuren en aangestoken bommen te bewegen. Bommen uit je inventaris en door zeldzame monsters geschopte bommen vliegen door obstakels en personages.
blast.bombproof_scroll.name=Rol van bommenbescherming
blast.bombproof_scroll.desc=Lees deze om 6 beurten lang immuun te zijn voor schade door bomexplosies.
blast.rubble.name=Puin
blast.rubble.desc=Rotsblokken veroorzaakt door een bom. Ze blokkeren de doorgang, maar een volgende explosie ruimt ze op.
blast.remote_bomb.timed_mode=Tijdmodus (ingedrukt: wisselen)
blast.remote_bomb.capacity_required=Voor tijdbommen werpen is een maximale capaciteit van minstens 2 nodig. De laatste plek blijft gereserveerd voor afstandsbommen. De test met oneindige bommen heft deze beperking op.
blast.remote_bomb.last_slot=De maximale capaciteit is nu 1. Offer een andere bom op om weer tijdbommen te werpen. Zodra er geen brandende bommen meer zijn, keert de afstandsmodus automatisch terug.
blast.remote_bomb.switch_blocked=Je kunt niet wisselen zolang er een aangestoken bom op deze verdieping ligt.
blast.remote_bomb.timed_enabled=Tijdmodus ingeschakeld.
blast.remote_bomb.remote_enabled=Afstandsmodus ingeschakeld.
blast.bomb_maniac.remote_throw=Op afstand werpen (ingedrukt: instellen)
blast.bomb_maniac.timed_throw=Tijdbom werpen (ingedrukt: instellen)
blast.bomb_maniac.aim=Kies een werpplek
blast.death_bomb.name=Dodelijke tegenaanvalbom
blast.death_bomb.desc=Een bom zoals die van Tengu, gericht op de held wanneer een vijand door een explosie van de Bommenmaniak sterft zonder buit achter te laten. Hij telt 3, 2, 1 af en beschadigt personages binnen twee tegels. Je kunt hem niet oppakken.
blast.death_bomb.cant_pickup=Vijandelijke tegenaanvalbommen kun je niet oppakken.
blast.death_bomb.ondeath=Je bent gedood door een dodelijke tegenaanvalbom.
