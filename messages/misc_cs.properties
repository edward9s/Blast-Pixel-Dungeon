blast.save_transfer.no_save=Nebyla nalezena žádná platná uložená hra.
blast.save_transfer.permission=Povolte správu souborů a zkuste to znovu.
blast.remote_bomb.buff_name=Ovládání bomb
blast.remote_bomb.buff_desc=Podržením spodního tlačítka bomby přepnete mezi dálkovým a časovaným režimem, pokud na podlaží nezůstala žádná zapálená bomba. V dálkovém režimu můžete bez spotřeby tahu položit bombu pod sebe a spodním tlačítkem odpálit nejstarší bombu. V časovaném režimu zamíříte a hodíte bombu za 1 tah; vybuchne sama. Spodní tlačítko místo srdce ukazuje nejkratší zbývající čas. Zvolený režim zůstane zachován po uložení i oživení. Časovaný hod vyžaduje kapacitu alespoň 2 a trvale sníží maximum o 1; poslední místo zůstává dálkovým bombám. Test nekonečných bomb tyto limity ruší. Při kapacitě 1 se po vyhasnutí všech bomb automaticky vrátí dálkový režim.
blast.remote_bomb.detonate=Odpálit bombu (podržet: přepnout)
blast.settings.infinite_bomb=Test: nekonečné bomby
blast.bomb_maniac.buff_name=Bombový maniak
blast.bomb_maniac.buff_desc=Stisknutím tlačítka na okraji obrazovky položíte v dálkovém režimu bombu pod sebe bez spotřeby tahu, nebo v časovaném režimu zamíříte a hodíte bombu za 1 tah. Maximum položených: %s. Dostupné: %s. Podržením vyberete nebo vložíte bomby. Po výbuchu se obsazená místa uvolní. Uhašené a sebrané bomby lze vložit, a tím obnovit obsazená místa. Časovaný hod vyžaduje kapacitu alespoň 2 a trvale sníží maximum o 1; poslední místo zůstává dálkovým bombám. Test nekonečných bomb tyto limity ruší. Při kapacitě 1 se po vyhasnutí všech bomb automaticky vrátí dálkový režim.
blast.bomb_maniac.window_title=Bombový maniak
blast.bomb_maniac.capacity=Kapacita: %s / Dostupné: %s
blast.bomb_maniac.imbue=Vložit bombu
blast.bomb_maniac.imbue_prompt=Vyberte bombu k vložení
blast.bomb_maniac.throw=Položit bombu (podržet: nastavení)
blast.bomb_maniac.no_charges=Nemáte dostupné bomby. Počkejte, až některá vybuchne, nebo vložte sebranou uhašenou bombu.
blast.bomb_maniac.blocked=Zde nelze položit zapálenou bombu.
blast.bomb.lit_pickup=Zapálené bomby nelze sebrat.
blast.free_movement.buff_name=Průchod překážkami
blast.free_movement.buff_desc=Můžete procházet zdmi, zamčenými dveřmi a zapálenými bombami. Zbývá %s tahů. Během účinku bomby hozené z inventáře i bomby odkopnuté vzácnými nepřáteli prolétají terénem a postavami.
blast.radius.buff_name=Rozšířené výbuchy
blast.radius.buff_desc=Poloměr výbuchu všech bomb se zvyšuje o %s. Běžným sbíráním lze získat nejvýše +1.
blast.indestructible.buff_name=Odolnost vůči bombám
blast.indestructible.buff_desc=Ještě %s tahů jste imunní vůči poškození výbuchem bomb.
blast.radius_pickup.name=Vylepšení ohnivých výbuchů
blast.radius_pickup.desc=Sebráním se poloměr výbuchu všech bomb zvětší o 1 (běžné maximum +1). Pokud již účinek máte, další sebrání dá 10 zlatých. Při zničení ohněm nebo výbuchem se poblíž objeví až 8 příšer s adrenalinem na 1 000 000 tahů.
blast.haste_pickup.name=Boty rychlosti
blast.haste_pickup.desc=Sebráním okamžitě získáte účinek lektvaru spěchu (trojnásobná rychlost pohybu na 20 tahů), aniž ho vypijete. Pokud účinek již trvá, prodlouží se o 20 tahů místo získání zlata. Při zničení ohněm nebo výbuchem se poblíž objeví až 8 příšer s adrenalinem na 1 000 000 tahů.
blast.phase_potion.name=Lektvar průchodu překážkami
blast.phase_potion.desc=Vypitím získáte na 6 tahů schopnost procházet zdmi, zamčenými dveřmi a zapálenými bombami. Bomby z inventáře a bomby odkopnuté vzácnými nepřáteli procházejí překážkami i postavami.
blast.bombproof_scroll.name=Svitek ochrany před bombami
blast.bombproof_scroll.desc=Přečtěte ho a získáte na 6 tahů imunitu proti poškození výbuchem bomb.
blast.rubble.name=Suť
blast.rubble.desc=Kameny uvolněné výbuchem bomby. Blokují cestu, ale další výbuch je odstraní.
blast.remote_bomb.timed_mode=Časovaný režim (podržet: přepnout)
blast.remote_bomb.capacity_required=Časované hody vyžadují maximální kapacitu alespoň 2 bomb. Poslední místo je vyhrazeno pro dálkové bomby. Test nekonečných bomb toto omezení ruší.
blast.remote_bomb.last_slot=Maximální kapacita klesla na 1. Další časované hody vyžadují vložení bomby. Jakmile nezůstanou žádné zapálené bomby, automaticky se obnoví dálkový režim.
blast.remote_bomb.switch_blocked=Nelze přepnout režim, dokud je na podlaží zapálená bomba.
blast.remote_bomb.timed_enabled=Časovaný režim zapnut.
blast.remote_bomb.remote_enabled=Dálkový režim zapnut.
blast.bomb_maniac.remote_throw=Dálkový hod (podržet: nastavení)
blast.bomb_maniac.timed_throw=Časovaný hod (podržet: nastavení)
blast.bomb_maniac.aim=Vyberte místo hodu
blast.death_bomb.name=Posmrtná odvetná bomba
blast.death_bomb.desc=Bomba ve stylu Tengu vržená na hrdinu, když nepřítel zemře výbuchem bomby Bombového maniaka a nezanechá kořist. Odpočítá 3, 2, 1 a poškodí postavy do vzdálenosti dvou polí. Nelze ji sebrat.
blast.death_bomb.cant_pickup=Nepřátelské odvetné bomby nelze sebrat.
blast.death_bomb.ondeath=Zabila vás posmrtná odvetná bomba.
