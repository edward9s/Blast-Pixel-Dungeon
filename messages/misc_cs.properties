blast.settings.indestructible_test_desc=Test odolnosti vůči bombám je zapnutý. Poškození výbuchem bomb bude blokováno až do vypnutí této volby.
blast.settings.free_movement_test_desc=Test průchodu překážkami je zapnutý. Dokud ho nevypnete, můžete procházet podporovanými překážkami.
blast.settings.remote_throw_test_desc=Test dálkového hodu je zapnutý. V dálkovém režimu lze bez spotřeby tahu zamířit a hodit ovladatelnou bombu, kterou poté odpálíte tlačítkem ovládání.
