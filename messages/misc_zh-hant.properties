blast.save_transfer.permission=請授予檔案管理權限後重試。
blast.remote_bomb.buff_name=炸彈控制
blast.remote_bomb.buff_desc=長按下方炸彈按鈕可切換模式，場上有已點燃炸彈時不可切換。遠投需要最大容量至少 2 格，每次遠投永久扣除 1 格最大容量，最後 1 格保留給遙控炸彈；開啟「測試：無限炸彈」時不受限制。容量降為 1 時，等場上已點燃炸彈全部消失便自動恢復遙控模式。遙控模式：腳下零回合放彈，短按下方按鈕引爆最早放置的炸彈。倒計時模式：投擲消耗 1 回合，自動倒數爆炸。選擇的模式會隨存檔保留。
blast.remote_bomb.detonate=遙控引爆（長按切換）
blast.settings.infinite_bomb=測試：無限炸彈
blast.bomb_maniac.buff_name=炸彈狂
blast.bomb_maniac.buff_desc=短按畫面邊緣的按鈕，遙控模式會在腳下零回合放彈，倒計時模式則瞄準投擲並消耗 1 回合。最大容量：%s；目前可用：%s。每次遠投永久消耗 1 格最大容量，最低保留 1 格供遙控使用；開啟「測試：無限炸彈」時不扣容量。長按選擇炸彈種類或灌注背包炸彈增加容量。遙控炸彈爆炸後返還佔用額度；熄火後回收的炸彈可灌注返還額度。
blast.bomb_maniac.window_title=炸彈狂
blast.bomb_maniac.capacity=最大數：%s／可用：%s
blast.bomb_maniac.imbue=灌注炸彈
blast.bomb_maniac.imbue_prompt=選擇灌注炸彈
blast.bomb_maniac.throw=腳下放彈（長按設定）
blast.bomb_maniac.no_charges=炸彈額度已滿，需等待炸彈爆炸，或灌注已回收的熄火炸彈。
blast.bomb_maniac.blocked=這裡無法放置點燃的炸彈。
blast.bomb.lit_pickup=點燃的炸彈無法撿拾。
blast.free_movement.buff_name=來去自如
blast.free_movement.buff_desc=可穿越一般牆壁、隱藏門、上鎖或水晶門，以及點燃的炸彈。剩餘 %s 回合。啟用期間，背包投出的炸彈與稀有怪踢出的炸彈可穿越地形和角色，並落在有效格子。
blast.radius.buff_name=爆炸範圍增幅
blast.radius.buff_desc=所有炸彈爆炸範圍 +%s。正常撿取增幅的上限為 +1。
blast.indestructible.buff_name=金剛不壞
blast.indestructible.buff_desc=免疫炸彈爆炸傷害，剩餘 %s 回合。
blast.radius_pickup.name=火焰爆炸增幅
blast.radius_pickup.desc=撿拾後立即讓所有炸彈的爆炸範圍 +1（正常撿取上限 +1）。已有增幅 Buff 時，再撿拾會獲得 10 金幣。若遭火焰燒毀或爆炸破壞，會在道具周圍召出最多 8 隻具有 100 萬回合激素湧動的該層怪物。
blast.haste_pickup.name=加速鞋
blast.haste_pickup.desc=撿拾後立即獲得極速藥劑的效果，移動速度提高為 3 倍，持續 20 回合，不需飲用藥劑。若已有極速 Buff，則額外延長 20 回合，直接累加剩餘時間，不會改成 10 金幣。若遭火焰燒毀或爆炸破壞，會在道具周圍召出最多 8 隻具有 100 萬回合激素湧動的該層怪物。
blast.phase_potion.name=來去自如藥水
blast.phase_potion.desc=喝下後獲得 6 回合來去自如，能穿越牆壁、上鎖的門及點燃的炸彈。生效期間，從背包投出的炸彈與稀有怪踢出的炸彈均可穿過地形及角色。
blast.bombproof_scroll.name=金剛不壞卷軸
blast.bombproof_scroll.desc=閱讀後獲得 6 回合金剛不壞，免疫炸彈爆炸傷害。
blast.rubble.name=瓦礫
blast.rubble.desc=爆炸造成的坍方落石，會阻擋移動。再次受到炸彈爆炸波及即可清除。
blast.remote_bomb.timed_mode=倒計時模式（長按切換）
blast.remote_bomb.capacity_required=遠投需要至少 2 格最大炸彈容量，最後 1 格必須保留給遙控炸彈；開啟「測試：無限炸彈」則不受限制。
blast.remote_bomb.last_slot=最大炸彈容量已降為 1，無法繼續遠投。灌注炸彈可增加容量；場上已點燃炸彈全部消失後將自動恢復遙控模式。
blast.remote_bomb.switch_blocked=場上還有已點燃的炸彈，無法切換模式。
blast.remote_bomb.timed_enabled=已切換為倒計時模式。
blast.remote_bomb.remote_enabled=已切換為遙控模式。
blast.bomb_maniac.remote_throw=遙控投擲（長按設定）
blast.bomb_maniac.timed_throw=倒計時投擲（長按設定）
blast.bomb_maniac.aim=選擇投擲位置
blast.death_bomb.name=死亡反擊炸彈
blast.death_bomb.desc=怪物被炸彈狂的炸彈炸死且沒有掉寶時，可能向英雄腳下丟出的天狗式炸彈。會倒數 3、2、1，再對兩格範圍內的角色造成傷害。無法撿拾。
blast.death_bomb.cant_pickup=無法撿拾敵人的死亡反擊炸彈。
blast.death_bomb.ondeath=你被死亡反擊炸彈炸死了。
