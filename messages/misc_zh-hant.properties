blast.settings.indestructible_test_desc=已啟用金剛不壞測試，可持續免疫炸彈爆炸傷害。關閉測試開關即可取消。
blast.settings.free_movement_test_desc=已啟用來去自如測試，可持續穿越指定障礙物。關閉測試開關即可取消。
blast.settings.remote_throw_test_desc=已啟用遙控投擲測試。遙控模式下可瞄準投出可控炸彈，不消耗回合，再使用遙控按鈕引爆。
