blast.settings.indestructible_test_desc=Тест защиты от бомб включён. Урон от взрывов бомб не наносится, пока настройка не будет выключена.
blast.settings.free_movement_test_desc=Тест прохождения сквозь препятствия включён. Вы можете проходить сквозь поддерживаемые препятствия, пока настройка не будет выключена.
blast.settings.remote_throw_test_desc=Тест дистанционного броска включён. В дистанционном режиме можно прицелиться и бросить управляемую бомбу без затраты хода, а затем взорвать её кнопкой управления.
