blast.remote_bomb.buff_name=Управление бомбами
blast.remote_bomb.buff_desc=Удерживайте нижнюю кнопку бомбы, чтобы переключаться между дистанционным режимом и режимом таймера. Переключение недоступно, пока на этаже есть зажжённые бомбы. Дистанционный режим: мгновенно размещайте бомбы под ногами без затрат ходов и взрывайте самую старую нижней кнопкой. Режим таймера: цельтесь и бросайте бомбы за 1 ход; они взрываются автоматически. Вместо сердца нижняя кнопка показывает наименьшее оставшееся время до взрыва. Выбранный режим сохраняется при сохранении и воскрешении. Каждый бросок с таймером требует вместимости не менее 2 и навсегда уменьшает её максимум на 1; последняя ячейка остаётся для дистанционных бомб. Тест бесконечных бомб отменяет эти ограничения. При вместимости 1 дистанционный режим восстановится, когда все зажжённые бомбы исчезнут.
blast.remote_bomb.detonate=Взорвать бомбу (удерживать: переключить)
blast.settings.infinite_bomb=Тест: бесконечные бомбы
blast.bomb_maniac.buff_name=Бомбоман
blast.bomb_maniac.buff_desc=Нажмите кнопку у края экрана, чтобы без затрат хода разместить дистанционную бомбу под ногами или за 1 ход прицелиться и бросить бомбу с таймером — в зависимости от режима. Максимум размещено: %s. Доступно: %s. Удерживайте кнопку для выбора или насыщения бомб. После взрыва занятые ячейки освобождаются. Погасшие подобранные бомбы можно использовать для насыщения, чтобы вернуть занятые ячейки. Каждый бросок с таймером требует вместимости не менее 2 и навсегда уменьшает её максимум на 1; последняя ячейка остаётся для дистанционных бомб. Тест бесконечных бомб отменяет эти ограничения. При вместимости 1 дистанционный режим восстановится, когда все зажжённые бомбы исчезнут.
blast.bomb_maniac.window_title=Бомбоман
blast.bomb_maniac.capacity=Вместимость: %s / Доступно: %s
blast.bomb_maniac.imbue=Насытить бомбой
blast.bomb_maniac.imbue_prompt=Выберите бомбу для насыщения
blast.bomb_maniac.throw=Разместить бомбу (удерживать: настройка)
blast.bomb_maniac.no_charges=Нет доступных бомб. Дождитесь взрыва одной из них или используйте погасшую подобранную бомбу для насыщения.
blast.bomb_maniac.blocked=Здесь нельзя разместить зажжённую бомбу.
blast.bomb.lit_pickup=Зажжённые бомбы нельзя подбирать.
blast.free_movement.buff_name=Прохождение сквозь стены
blast.free_movement.buff_desc=Позволяет проходить сквозь стены, запертые двери и зажжённые бомбы. Осталось ходов: %s. Пока эффект действует, бомбы, брошенные из инвентаря или пнутые редкими монстрами, пролетают сквозь местность и персонажей.
blast.radius.buff_name=Увеличенный радиус взрыва
blast.radius.buff_desc=Радиус взрыва всех бомб увеличен на %s. Обычный подбор повышает его максимум на +1.
blast.indestructible.buff_name=Защита от бомб
blast.indestructible.buff_desc=Иммунитет к урону от взрывов бомб ещё на %s ходов.
blast.radius_pickup.name=Усиление огненного взрыва
blast.radius_pickup.desc=При подборе радиус взрыва всех бомб сразу увеличивается на 1 (обычный предел +1). Если эффект уже действует, дополнительный предмет даёт 10 золота. Если предмет уничтожен огнём или взрывом, рядом появляется до 8 монстров с адреналином на 1 000 000 ходов.
blast.haste_pickup.name=Сапоги скорости
blast.haste_pickup.desc=При подборе сразу дают эффект зелья скорости (утроенная скорость передвижения на 20 ходов), без необходимости пить зелье. Если эффект уже действует, его длительность увеличивается на 20 ходов вместо получения золота. При уничтожении огнём или взрывом рядом появляется до 8 монстров с адреналином на 1 000 000 ходов.
blast.phase_potion.name=Зелье прохождения сквозь стены
blast.phase_potion.desc=Выпейте, чтобы 6 ходов проходить сквозь стены, запертые двери и зажжённые бомбы. Бомбы из инвентаря и бомбы, пнутые редкими монстрами, пролетают сквозь препятствия и персонажей.
blast.bombproof_scroll.name=Свиток защиты от бомб
blast.bombproof_scroll.desc=Прочитайте, чтобы на 6 ходов стать невосприимчивым к урону от взрывов бомб.
blast.rubble.name=Обломки
blast.rubble.desc=Каменные обломки после взрыва бомбы. Преграждают путь, но уничтожаются следующим взрывом.
blast.remote_bomb.timed_mode=Режим таймера (удерживать: переключить)
blast.remote_bomb.capacity_required=Для броска бомбы с таймером нужна максимальная вместимость не менее 2. Последняя ячейка зарезервирована для дистанционных бомб. Тест бесконечных бомб снимает это ограничение.
blast.remote_bomb.last_slot=Максимальная вместимость снизилась до 1. Чтобы снова бросать бомбы с таймером, насытьте ещё одну бомбу. Когда не останется зажжённых бомб, дистанционный режим восстановится автоматически.
blast.remote_bomb.switch_blocked=Нельзя сменить режим, пока на этом этаже есть зажжённые бомбы.
blast.remote_bomb.timed_enabled=Режим таймера включён.
blast.remote_bomb.remote_enabled=Дистанционный режим включён.
blast.bomb_maniac.remote_throw=Дистанционный бросок (удерживать: настройка)
blast.bomb_maniac.timed_throw=Бросок с таймером (удерживать: настройка)
blast.bomb_maniac.aim=Выберите место броска
blast.death_bomb.name=Посмертная контрбомба
blast.death_bomb.desc=Бомба в стиле Тенгу, которую бросают в сторону героя, когда враг погибает от взрыва бомбы Бомбомана и не оставляет добычи. Отсчитывает 3, 2, 1, затем наносит урон персонажам в радиусе двух клеток. Её нельзя подобрать.
blast.death_bomb.cant_pickup=Вражеские контрбомбы нельзя подбирать.
blast.death_bomb.ondeath=Вас убила посмертная контрбомба.
