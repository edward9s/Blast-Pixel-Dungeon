blast.remote_bomb.buff_name=炸弹控制
blast.remote_bomb.buff_desc=长按下方炸弹按钮，可在遥控模式与倒计时模式之间切换；但本层存在已点燃炸弹时无法切换。遥控模式：在脚下立即放置炸弹，不消耗回合，短按下方按钮引爆最早放置的炸弹。倒计时模式：瞄准并投掷炸弹，消耗1回合，之后自动爆炸；下方按钮不显示爱心，而显示最短的剩余倒计时。所选模式会随存档及复活保留。 远投需要最大容量至少 2 格，每次远投永久扣除 1 格最大容量，最后 1 格留给遥控炸弹。开启“测试：无限炸弹”时不受容量限制，也不会扣除最大容量。容量降为 1 后，场上炸弹全部消失时自动恢复遥控模式。
blast.remote_bomb.detonate=遥控引爆（长按切换）
blast.settings.infinite_bomb=测试：无限炸弹
blast.bomb_maniac.buff_name=炸弹狂
blast.bomb_maniac.buff_desc=短按屏幕边缘按钮，在遥控模式下可以立即在脚下放置炸弹，不消耗回合；在倒计时模式下可以瞄准投掷炸弹，消耗1回合。最大同时放置数：%s；当前可用：%s。长按选择炸弹类型或灌注炸弹以增加容量。炸弹爆炸后返还可用数量；回收的熄灭炸弹可以灌注以返还占用的数量。 远投需要最大容量至少 2 格，每次远投永久扣除 1 格最大容量，最后 1 格留给遥控炸弹。开启“测试：无限炸弹”时不受容量限制，也不会扣除最大容量。容量降为 1 后，场上炸弹全部消失时自动恢复遥控模式。
