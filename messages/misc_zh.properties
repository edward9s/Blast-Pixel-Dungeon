blast.bomb_maniac.imbue_prompt=选择灌注炸弹
blast.bomb_maniac.throw=脚下放弹（长按设置）
blast.bomb_maniac.no_charges=当前没有可用炸弹，请等待一颗炸弹爆炸，或灌注已回收的熄灭炸弹。
blast.bomb_maniac.blocked=这里无法放置已点燃的炸弹。
blast.bomb.lit_pickup=已点燃的炸弹无法拾取。
blast.free_movement.buff_name=自由穿行
blast.free_movement.buff_desc=可以穿过墙壁、锁住的门和已点燃的炸弹。剩余%s回合。效果持续期间，从背包投出的炸弹以及稀有怪物踢出的炸弹，可以穿过地形与角色后落地。
blast.radius.buff_name=爆炸范围增幅
blast.radius.buff_desc=所有炸弹的爆炸范围增加%s。正常拾取最多增加1。
blast.indestructible.buff_name=炸弹免疫
blast.indestructible.buff_desc=剩余%s回合内免疫炸弹爆炸伤害。
blast.radius_pickup.name=火焰爆炸增幅
blast.radius_pickup.desc=拾取后，所有炸弹的爆炸范围立即增加1（正常拾取上限为+1）。如果已拥有此增益，额外拾取时获得10金币。若该物品被火焰或爆炸摧毁，会在附近召唤最多8只怪物，并赋予它们持续1,000,000回合的肾上腺素效果。
blast.haste_pickup.name=加速靴
blast.haste_pickup.desc=拾取后立即获得极速药剂的效果，移动速度提升至3倍，持续20回合，无需饮用药剂。如果已经处于极速效果下，则延长20回合，而非给予金币。若被火焰或爆炸摧毁，会在附近召唤最多8只获得持续1,000,000回合肾上腺素效果的怪物。
blast.phase_potion.name=自由穿行药剂
blast.phase_potion.desc=饮用后获得6回合自由穿行效果，可以穿过墙壁、锁住的门和已点燃的炸弹。效果持续期间，从背包投出的炸弹与稀有怪物踢出的炸弹可以穿过障碍物和角色。
blast.bombproof_scroll.name=炸弹免疫卷轴
blast.bombproof_scroll.desc=阅读后获得6回合炸弹免疫效果。
blast.rubble.name=碎石
blast.rubble.desc=炸弹造成的落石。会阻挡移动，但再次受到炸弹爆炸波及时即可清除。
blast.remote_bomb.timed_mode=倒计时模式（长按切换）
blast.remote_bomb.capacity_required=远投至少需要 2 格最大炸弹容量，最后 1 格留给遥控炸弹；开启“测试：无限炸弹”时不受限制。
blast.remote_bomb.last_slot=最大炸弹容量已降为 1，无法继续远投。灌注炸弹可增加容量；本层已点燃炸弹全部消失后将自动恢复遥控模式。
blast.remote_bomb.switch_blocked=本层还有已点燃的炸弹，无法切换模式。
blast.remote_bomb.timed_enabled=已切换为倒计时模式。
blast.remote_bomb.remote_enabled=已切换为遥控模式。
