blast.bomb_maniac.aim=选择投掷位置
blast.death_bomb.name=死亡反击炸弹
blast.death_bomb.desc=怪物被炸弹狂的炸弹炸死且没有掉落战利品时，会向英雄投掷的天狗式炸弹。倒数3、2、1后，对两格范围内的角色造成伤害。无法拾取。
blast.death_bomb.cant_pickup=无法拾取敌人的死亡反击炸弹。
blast.death_bomb.ondeath=你被死亡反击炸弹炸死了。
