blast.remote_bomb.buff_name=Control de bombas
blast.remote_bomb.buff_desc=Mantén pulsado el botón de bomba inferior para alternar entre el modo remoto y el temporizado, siempre que no queden bombas encendidas en este piso. Modo remoto: coloca bombas a tus pies sin gastar turnos y detona la más antigua con el botón inferior. Modo temporizado: apunta y lanza bombas gastando 1 turno; explotarán automáticamente. El botón inferior muestra la cuenta atrás más corta en lugar del corazón. El modo elegido se conserva al guardar y resucitar. Cada lanzamiento temporizado requiere al menos 2 ranuras y reduce permanentemente la capacidad máxima en 1; la última queda reservada para las bombas remotas. La prueba de bombas infinitas anula estas restricciones. Con capacidad 1, el modo remoto vuelve cuando ya no quedan bombas encendidas.
blast.remote_bomb.detonate=Detonar bomba remota (mantener: cambiar)
blast.settings.infinite_bomb=Prueba: bombas infinitas
blast.bomb_maniac.buff_name=Maníaco de las bombas
blast.bomb_maniac.buff_desc=Pulsa el botón del borde de la pantalla para colocar una bomba remota a tus pies sin gastar turnos o para apuntar y lanzar una bomba temporizada gastando un turno, según el modo. Máximo desplegado: %s. Disponibles: %s. Mantén pulsado para elegir o imbuir bombas. Las explosiones devuelven espacios de despliegue. Las bombas recuperadas y apagadas pueden imbuirse para recuperar espacios ocupados. Cada lanzamiento temporizado requiere al menos 2 ranuras y reduce permanentemente la capacidad máxima en 1; la última queda reservada para las bombas remotas. La prueba de bombas infinitas anula estas restricciones. Con capacidad 1, el modo remoto vuelve cuando ya no quedan bombas encendidas.
blast.bomb_maniac.window_title=Maníaco de las bombas
blast.bomb_maniac.capacity=Capacidad: %s / Disponibles: %s
blast.bomb_maniac.imbue=Imbuir bomba
blast.bomb_maniac.imbue_prompt=Elige una bomba para imbuir
blast.bomb_maniac.throw=Colocar bomba (mantener: configurar)
blast.bomb_maniac.no_charges=No hay bombas disponibles hasta que una explote o se imbuya una bomba recuperada y apagada.
blast.bomb_maniac.blocked=No se puede colocar una bomba encendida aquí.
blast.bomb.lit_pickup=No se pueden recoger bombas encendidas.
blast.free_movement.buff_name=Atravesar obstáculos
blast.free_movement.buff_desc=Puedes atravesar paredes, puertas cerradas y bombas encendidas. Quedan %s turnos. Mientras dure el efecto, las bombas lanzadas desde el inventario y las pateadas por enemigos raros atraviesan el terreno y los personajes antes de caer.
blast.radius.buff_name=Explosiones ampliadas
blast.radius.buff_desc=Todas las bombas tienen +%s de radio de explosión. Las recogidas normales otorgan como máximo +1.
blast.indestructible.buff_name=Inmunidad a bombas
blast.indestructible.buff_desc=Inmune al daño por explosiones de bombas durante %s turnos más.
blast.radius_pickup.name=Mejora de explosión ígnea
blast.radius_pickup.desc=Al recogerlo, aumenta en 1 el radio de explosión de todas las bombas (máximo +1 por recogidas normales). Si ya tienes el efecto, cada recogida adicional otorga 10 de oro. Si el fuego o una explosión destruyen este objeto, aparecen hasta 8 monstruos cerca con adrenalina durante 1.000.000 de turnos.
blast.haste_pickup.name=Botas de velocidad
blast.haste_pickup.desc=Al recogerlas, recibes de inmediato el efecto de una poción de rapidez (velocidad de movimiento triple durante 20 turnos), sin beberla. Si el efecto ya está activo, su duración aumenta 20 turnos en lugar de recibir oro. Si el fuego o una explosión las destruyen, aparecen hasta 8 monstruos cercanos con adrenalina durante 1.000.000 de turnos.
blast.phase_potion.name=Poción de atravesar obstáculos
blast.phase_potion.desc=Bébela para atravesar paredes, puertas cerradas y bombas encendidas durante 6 turnos. Las bombas lanzadas desde el inventario y las pateadas por enemigos raros atraviesan obstáculos y personajes.
blast.bombproof_scroll.name=Pergamino de protección contra bombas
blast.bombproof_scroll.desc=Léelo para ser inmune al daño por explosiones de bombas durante 6 turnos.
blast.rubble.name=Escombros
blast.rubble.desc=Restos de roca desprendidos por una bomba. Impiden el paso, pero otra explosión puede despejarlos.
blast.remote_bomb.timed_mode=Modo temporizado (mantener: cambiar)
blast.remote_bomb.capacity_required=Para lanzar bombas temporizadas necesitas una capacidad máxima de al menos 2. La última ranura se reserva para las bombas remotas. La prueba de bombas infinitas elimina esta restricción.
blast.remote_bomb.last_slot=La capacidad máxima ha bajado a 1. Imbuye otra bomba para volver a lanzar bombas temporizadas. Cuando no queden bombas encendidas, se volverá automáticamente al modo remoto.
blast.remote_bomb.switch_blocked=No puedes cambiar de modo mientras haya alguna bomba encendida en este piso.
blast.remote_bomb.timed_enabled=Modo temporizado activado.
blast.remote_bomb.remote_enabled=Modo remoto activado.
