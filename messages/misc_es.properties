blast.bomb_maniac.timed_throw=Lanzamiento temporizado (mantener: configurar)
blast.bomb_maniac.aim=Elige dónde lanzar
blast.death_bomb.name=Bomba de contraataque mortal
blast.death_bomb.desc=Una bomba al estilo de Tengu que se lanza hacia el héroe cuando un enemigo muere por una explosión del Maníaco de las bombas sin soltar botín. Cuenta 3, 2, 1 y daña a los personajes en un radio de dos casillas. No se puede recoger.
blast.death_bomb.cant_pickup=No se pueden recoger las bombas de contraataque enemigas.
blast.death_bomb.ondeath=Has muerto por una bomba de contraataque mortal.
