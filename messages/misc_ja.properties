blast.remote_bomb.buff_name=爆弾操作
blast.remote_bomb.buff_desc=下部の爆弾ボタンを長押しすると、遠隔操作モードと時限式モードを切り替えられます。ただし、この階に点火済みの爆弾がある間は切り替えられません。遠隔操作モードでは足元にターン消費なしで爆弾を設置でき、ボタンを押すと最も古い爆弾が爆発します。時限式モードでは狙って投げるのに1ターン消費し、爆弾は自動的に爆発します。下部のボタンにはハートの代わりに最短の残り時間が表示されます。モードはセーブと復活後も保持されます。 時限式の投擲には最大容量2以上が必要で、投げるたびに最大容量が永久に1減ります。最後の1枠は遠隔操作用です。無限爆弾テスト中は容量制限と消費が無効になります。容量が1の場合、点火済みの爆弾がなくなると遠隔操作モードへ戻ります。
blast.remote_bomb.detonate=遠隔起爆（長押しで切替）
blast.settings.infinite_bomb=テスト：爆弾無制限
blast.bomb_maniac.buff_name=爆弾マニア
blast.bomb_maniac.buff_desc=画面端のボタンを押すと、遠隔操作モードではターン消費なしで足元に爆弾を設置し、時限式モードでは1ターン消費して狙った場所に投げます。同時設置上限：%s、使用可能数：%s。長押しすると爆弾の種類を選択したり、爆弾を注入して上限を増やしたりできます。爆発すると設置枠が戻ります。消火されて回収した爆弾は注入することで使用枠を回復できます。 時限式の投擲には最大容量2以上が必要で、投げるたびに最大容量が永久に1減ります。最後の1枠は遠隔操作用です。無限爆弾テスト中は容量制限と消費が無効になります。容量が1の場合、点火済みの爆弾がなくなると遠隔操作モードへ戻ります。
blast.bomb_maniac.window_title=爆弾マニア
blast.bomb_maniac.capacity=上限：%s／使用可能：%s
blast.bomb_maniac.imbue=爆弾を注入
blast.bomb_maniac.imbue_prompt=注入する爆弾を選択
blast.bomb_maniac.throw=足元に設置（長押しで設定）
blast.bomb_maniac.no_charges=使用できる爆弾がありません。爆発を待つか、回収した消火済みの爆弾を注入してください。
blast.bomb_maniac.blocked=ここには点火済みの爆弾を設置できません。
blast.bomb.lit_pickup=点火済みの爆弾は拾えません。
blast.free_movement.buff_name=壁抜け
blast.free_movement.buff_desc=壁、鍵のかかった扉、点火済みの爆弾を通り抜けられます。残り%sターン。効果中は、所持品から投げた爆弾と希少な敵が蹴った爆弾が地形やキャラクターを通り抜けて着地します。
blast.radius.buff_name=爆発範囲拡大
blast.radius.buff_desc=すべての爆弾の爆発範囲が%s増加します。通常の拾得による増加は最大+1です。
blast.indestructible.buff_name=爆発ダメージ無効
blast.indestructible.buff_desc=あと%sターン、爆弾の爆発ダメージを受けません。
blast.radius_pickup.name=炎の爆発強化
blast.radius_pickup.desc=拾うとすべての爆弾の爆発範囲が1増加します（通常の拾得による上限は+1）。すでに効果がある場合は10ゴールドを獲得します。炎や爆発で破壊されると、その付近に最大8体の敵が出現し、1,000,000ターンのアドレナリン効果を得ます。
blast.haste_pickup.name=加速の靴
blast.haste_pickup.desc=拾うと、薬を飲まずに俊敏のポーションと同じ効果（移動速度3倍、20ターン）を得ます。すでに効果中なら、ゴールドの代わりに持続時間が20ターン延長されます。炎や爆発で破壊されると、付近に最大8体の敵が出現し、1,000,000ターンのアドレナリン効果を得ます。
blast.phase_potion.name=壁抜けのポーション
blast.phase_potion.desc=飲むと6ターンの間、壁、鍵のかかった扉、点火済みの爆弾を通り抜けられます。効果中は所持品から投げた爆弾と希少な敵が蹴った爆弾も、障害物やキャラクターを通り抜けます。
blast.bombproof_scroll.name=耐爆の巻物
blast.bombproof_scroll.desc=読むと6ターンの間、爆弾の爆発ダメージを受けなくなります。
blast.rubble.name=瓦礫
blast.rubble.desc=爆弾で崩れた岩の破片です。通行を妨げますが、もう一度爆発を受けると取り除かれます。
blast.remote_bomb.timed_mode=時限式モード（長押しで切替）
blast.remote_bomb.capacity_required=時限式の投擲には最大容量が2以上必要です。最後の1枠は遠隔操作用に確保されます。無限爆弾テスト中はこの制限がなくなります。
blast.remote_bomb.last_slot=最大容量が1になりました。時限式の投擲を再開するには爆弾を注入してください。点火済みの爆弾がすべてなくなると、自動的に遠隔操作モードへ戻ります。
blast.remote_bomb.switch_blocked=この階に点火済みの爆弾がある間はモードを切り替えられません。
blast.remote_bomb.timed_enabled=時限式モードに切り替えました。
blast.remote_bomb.remote_enabled=遠隔操作モードに切り替えました。
blast.bomb_maniac.remote_throw=遠隔投擲（長押しで設定）
blast.bomb_maniac.timed_throw=時限式投擲（長押しで設定）
blast.bomb_maniac.aim=投擲位置を選択
blast.death_bomb.name=死亡時の反撃爆弾
blast.death_bomb.desc=爆弾マニアの爆発で敵が倒され、戦利品を落とさなかったとき、英雄に向けて投げられる天狗型の爆弾です。3、2、1とカウントダウンした後、2マス以内のキャラクターにダメージを与えます。拾うことはできません。
blast.death_bomb.cant_pickup=敵の反撃爆弾は拾えません。
blast.death_bomb.ondeath=死亡時の反撃爆弾によって倒されました。
