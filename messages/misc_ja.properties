blast.settings.indestructible_test_desc=爆発ダメージ無効のテストが有効です。設定をオフにするまで爆弾の爆発によるダメージを受けません。
blast.settings.free_movement_test_desc=壁抜けのテストが有効です。設定をオフにするまで、指定された障害物を通り抜けられます。
blast.settings.remote_throw_test_desc=遠隔投擲のテストが有効です。遠隔操作モードでは、ターンを消費せずに狙った場所へ操作可能な爆弾を投げ、遠隔操作ボタンで起爆できます。
