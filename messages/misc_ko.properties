blast.settings.indestructible_test_desc=폭탄 피해 면역 테스트가 활성화되었습니다. 설정을 끌 때까지 폭탄 폭발로 인한 피해를 받지 않습니다.
blast.settings.free_movement_test_desc=장애물 통과 테스트가 활성화되었습니다. 설정을 끌 때까지 지정된 장애물을 통과할 수 있습니다.
blast.settings.remote_throw_test_desc=원격 투척 테스트가 활성화되었습니다. 원격 모드에서 턴을 소모하지 않고 조종 가능한 폭탄을 조준해 던진 다음 원격 버튼으로 폭발시킬 수 있습니다.
blast.settings.radius=테스트: 폭발 범위
