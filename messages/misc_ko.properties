blast.save_transfer.import=저장 데이터 가져오기
blast.save_transfer.export_failed=저장 데이터를 내보내지 못했습니다.
blast.save_transfer.import_failed=저장 데이터를 가져오지 못했습니다.
blast.save_transfer.exported=저장 데이터를 내보냈습니다.
blast.save_transfer.no_save=유효한 저장 데이터를 찾을 수 없습니다.
blast.save_transfer.permission=파일 관리 권한을 허용한 뒤 다시 시도하세요.
blast.remote_bomb.buff_name=폭탄 조종
blast.remote_bomb.buff_desc=아래쪽 폭탄 버튼을 길게 눌러 원격 모드와 시간제한 모드를 전환할 수 있습니다. 단, 현재 층에 불이 붙은 폭탄이 남아 있으면 전환할 수 없습니다. 원격 모드에서는 턴을 소모하지 않고 발밑에 폭탄을 설치하며, 버튼을 누르면 가장 먼저 설치한 폭탄이 폭발합니다. 시간제한 모드에서는 조준해 던지는 데 1턴이 들고 폭탄이 자동으로 폭발합니다. 아래쪽 버튼에는 하트 대신 가장 짧은 남은 시간이 표시됩니다. 선택한 모드는 저장 및 부활 후에도 유지됩니다. 시간제한 폭탄 투척에는 최대 용량 2 이상이 필요하며 투척할 때마다 최대 용량이 영구적으로 1 줄어듭니다. 마지막 1칸은 원격 폭탄용입니다. 무한 폭탄 테스트 중에는 이 제한과 소모가 적용되지 않습니다. 최대 용량이 1이면 모든 폭탄이 사라진 뒤 원격 모드로 돌아갑니다.
blast.remote_bomb.detonate=원격 폭파 (길게 눌러 전환)
blast.settings.infinite_bomb=테스트: 무한 폭탄
blast.bomb_maniac.buff_name=폭탄광
blast.bomb_maniac.buff_desc=화면 가장자리 버튼을 누르면 원격 모드에서는 턴 소모 없이 발밑에 폭탄을 설치하고, 시간제한 모드에서는 1턴을 사용해 조준하여 던집니다. 최대 설치 개수: %s, 사용 가능: %s. 길게 눌러 폭탄 종류를 선택하거나 폭탄을 주입해 용량을 늘리세요. 폭발하면 설치 칸이 반환됩니다. 꺼진 폭탄을 회수해 주입하면 사용 중인 칸을 되찾을 수 있습니다. 시간제한 폭탄 투척에는 최대 용량 2 이상이 필요하며 투척할 때마다 최대 용량이 영구적으로 1 줄어듭니다. 마지막 1칸은 원격 폭탄용입니다. 무한 폭탄 테스트 중에는 이 제한과 소모가 적용되지 않습니다. 최대 용량이 1이면 모든 폭탄이 사라진 뒤 원격 모드로 돌아갑니다.
blast.bomb_maniac.window_title=폭탄광
blast.bomb_maniac.capacity=최대: %s / 사용 가능: %s
blast.bomb_maniac.imbue=폭탄 주입
blast.bomb_maniac.imbue_prompt=주입할 폭탄 선택
blast.bomb_maniac.throw=발밑에 설치 (길게 눌러 설정)
blast.bomb_maniac.no_charges=사용할 수 있는 폭탄이 없습니다. 폭탄이 폭발할 때까지 기다리거나 회수한 꺼진 폭탄을 주입하세요.
blast.bomb_maniac.blocked=여기에는 점화된 폭탄을 설치할 수 없습니다.
blast.bomb.lit_pickup=점화된 폭탄은 주울 수 없습니다.
blast.free_movement.buff_name=장애물 통과
blast.free_movement.buff_desc=벽, 잠긴 문, 점화된 폭탄을 통과할 수 있습니다. 남은 시간: %s턴. 효과가 지속되는 동안 가방에서 던진 폭탄과 희귀 몬스터가 찬 폭탄은 지형과 캐릭터를 통과해 착지합니다.
blast.radius.buff_name=폭발 범위 증가
blast.radius.buff_desc=모든 폭탄의 폭발 범위가 %s만큼 증가합니다. 일반적인 획득으로는 최대 +1까지 증가합니다.
blast.indestructible.buff_name=폭탄 피해 면역
blast.indestructible.buff_desc=앞으로 %s턴 동안 폭탄의 폭발 피해를 받지 않습니다.
blast.radius_pickup.name=화염 폭발 강화
blast.radius_pickup.desc=획득하면 모든 폭탄의 폭발 범위가 1 증가합니다(일반 획득 최대 +1). 이미 효과가 있다면 추가 획득 시 10골드를 얻습니다. 불이나 폭발로 파괴되면 근처에 최대 8마리의 몬스터가 소환되며 1,000,000턴 동안 아드레날린 효과를 얻습니다.
blast.haste_pickup.name=신속의 장화
blast.haste_pickup.desc=획득하면 물약을 마시지 않고 신속의 물약 효과(이동 속도 3배, 20턴)를 즉시 얻습니다. 이미 신속 효과가 있다면 골드 대신 지속 시간이 20턴 연장됩니다. 불이나 폭발로 파괴되면 근처에 최대 8마리의 몬스터가 소환되며 1,000,000턴 동안 아드레날린 효과를 얻습니다.
blast.phase_potion.name=장애물 통과의 물약
blast.phase_potion.desc=마시면 6턴 동안 벽, 잠긴 문, 점화된 폭탄을 통과할 수 있습니다. 효과가 지속되는 동안 가방에서 던진 폭탄과 희귀 몬스터가 찬 폭탄도 장애물과 캐릭터를 통과합니다.
blast.bombproof_scroll.name=폭탄 피해 면역의 주문서
blast.bombproof_scroll.desc=읽으면 6턴 동안 폭탄 폭발 피해를 받지 않습니다.
blast.rubble.name=잔해
blast.rubble.desc=폭탄으로 무너진 돌무더기입니다. 이동을 막지만 다시 폭발에 휘말리면 제거됩니다.
blast.remote_bomb.timed_mode=시간제한 모드 (길게 눌러 전환)
blast.remote_bomb.capacity_required=시간제한 폭탄을 던지려면 최대 용량이 2 이상이어야 합니다. 마지막 1칸은 원격 폭탄용으로 남겨 둡니다. 무한 폭탄 테스트 중에는 이 제한이 적용되지 않습니다.
blast.remote_bomb.last_slot=최대 용량이 1이 되었습니다. 시간제한 폭탄을 다시 던지려면 폭탄을 주입하세요. 불붙은 폭탄이 모두 사라지면 원격 모드로 자동 전환됩니다.
blast.remote_bomb.switch_blocked=이 층에 점화된 폭탄이 남아 있어 모드를 전환할 수 없습니다.
blast.remote_bomb.timed_enabled=시간제한 모드로 전환했습니다.
blast.remote_bomb.remote_enabled=원격 모드로 전환했습니다.
blast.bomb_maniac.remote_throw=원격 투척 (길게 눌러 설정)
blast.bomb_maniac.timed_throw=시간제한 투척 (길게 눌러 설정)
blast.bomb_maniac.aim=투척 위치 선택
blast.death_bomb.name=죽음의 반격 폭탄
blast.death_bomb.desc=폭탄광의 폭발로 몬스터가 죽고 전리품을 떨어뜨리지 않았을 때 영웅을 향해 던져지는 텐구식 폭탄입니다. 3, 2, 1을 센 뒤 2칸 이내의 캐릭터에게 피해를 줍니다. 주울 수 없습니다.
blast.death_bomb.cant_pickup=적의 반격 폭탄은 주울 수 없습니다.
blast.death_bomb.ondeath=죽음의 반격 폭탄에 목숨을 잃었습니다.
