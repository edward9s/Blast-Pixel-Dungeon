blast.settings.indestructible_test_desc=Тест захисту від бомб увімкнено. Вибухи бомб не завдають шкоди, доки налаштування не буде вимкнено.
blast.settings.free_movement_test_desc=Тест проходження крізь перешкоди увімкнено. Ви можете проходити крізь підтримувані перешкоди, доки налаштування не буде вимкнено.
blast.settings.remote_throw_test_desc=Тест дистанційного кидка увімкнено. У дистанційному режимі можна прицілитися й кинути керовану бомбу без витрати ходу, а потім підірвати її кнопкою керування.
blast.settings.radius=Тест: радіус вибуху
blast.save_transfer.export=Експортувати збереження
blast.save_transfer.import=Імпортувати збереження
blast.save_transfer.export_failed=Не вдалося експортувати збереження.
blast.save_transfer.import_failed=Не вдалося імпортувати збереження.
blast.save_transfer.exported=Збереження експортовано.
blast.save_transfer.no_save=Не знайдено дійсного збереження гри.
blast.save_transfer.permission=Надайте дозвіл на керування файлами та спробуйте ще раз.
blast.remote_bomb.buff_name=Керування бомбами
blast.remote_bomb.buff_desc=Утримуйте нижню кнопку бомби, щоб перемкнути дистанційний режим і режим таймера, коли на цьому поверсі немає запалених бомб. Дистанційний режим: миттєво розміщуйте бомби під ногами без витрати ходу й підривайте найстарішу нижньою кнопкою. Режим таймера: прицільно кидайте бомби за 1 хід; вони вибухають автоматично. Нижня кнопка показує найкоротший час до вибуху замість серця. Обраний режим зберігається після запису гри та воскресіння. Кожен кидок із таймером вимагає місткості щонайменше 2 і назавжди зменшує її максимум на 1; останнє місце залишається для дистанційних бомб. Тест нескінченних бомб скасовує ці обмеження. За місткості 1 дистанційний режим відновиться після зникнення всіх запалених бомб.
blast.remote_bomb.detonate=Підірвати бомбу (утримати: перемкнути)
blast.settings.infinite_bomb=Тест: нескінченні бомби
blast.bomb_maniac.buff_name=Бомбоман
blast.bomb_maniac.buff_desc=Натисніть кнопку біля краю екрана, щоб у дистанційному режимі без витрати ходу покласти бомбу під ноги, або в режимі таймера за 1 хід прицілитися й кинути бомбу. Максимум розміщених: %s. Доступно: %s. Утримуйте, щоб вибрати чи використати бомби для поповнення. Вибухи звільняють зайняті місця. Згаслі підібрані бомби можна використати для повернення зайнятих місць. Кожен кидок із таймером вимагає місткості щонайменше 2 і назавжди зменшує її максимум на 1; останнє місце залишається для дистанційних бомб. Тест нескінченних бомб скасовує ці обмеження. За місткості 1 дистанційний режим відновиться після зникнення всіх запалених бомб.
blast.bomb_maniac.window_title=Бомбоман
blast.bomb_maniac.capacity=Місткість: %s / Доступно: %s
blast.bomb_maniac.imbue=Використати бомбу для поповнення
blast.bomb_maniac.imbue_prompt=Виберіть бомбу для поповнення
blast.bomb_maniac.throw=Покласти бомбу (утримати: налаштувати)
blast.bomb_maniac.no_charges=Немає доступних бомб. Дочекайтеся вибуху однієї з них або використайте підібрану згаслу бомбу.
blast.bomb_maniac.blocked=Тут не можна розмістити запалену бомбу.
blast.bomb.lit_pickup=Запалені бомби не можна підбирати.
blast.free_movement.buff_name=Прохід крізь перешкоди
blast.free_movement.buff_desc=Можна проходити крізь стіни, замкнені двері та запалені бомби. Залишилося %s ходів. Під час дії ефекту бомби з інвентарю та бомби, які штовхають рідкісні чудовиська, проходять крізь місцевість і персонажів перед приземленням.
blast.radius.buff_name=Збільшені вибухи
blast.radius.buff_desc=Радіус вибуху всіх бомб збільшено на %s. Звичайне підбирання додає щонайбільше +1.
blast.indestructible.buff_name=Захист від бомб
blast.indestructible.buff_desc=Імунітет до шкоди від вибухів бомб ще на %s ходів.
blast.radius_pickup.name=Посилення вогняного вибуху
blast.radius_pickup.desc=Підбирання миттєво збільшує радіус вибуху всіх бомб на 1 (звичайна межа +1). Якщо ефект уже діє, додаткове підбирання дає 10 золота. Якщо предмет знищить вогонь або вибух, поблизу з’явиться до 8 чудовиськ з адреналіном на 1 000 000 ходів.
blast.haste_pickup.name=Чоботи швидкості
blast.haste_pickup.desc=Підбирання миттєво надає ефект зілля швидкості (потрійна швидкість пересування на 20 ходів) без випивання зілля. Якщо ефект уже діє, його тривалість збільшується на 20 ходів замість отримання золота. У разі знищення вогнем або вибухом поблизу з’явиться до 8 чудовиськ з адреналіном на 1 000 000 ходів.
blast.phase_potion.name=Зілля проходження крізь перешкоди
blast.phase_potion.desc=Випийте, щоб 6 ходів проходити крізь стіни, замкнені двері та запалені бомби. Бомби з інвентарю та штовхнуті рідкісними чудовиськами проходять крізь перешкоди й персонажів.
blast.bombproof_scroll.name=Сувій захисту від бомб
blast.bombproof_scroll.desc=Прочитайте, щоб отримати імунітет до шкоди від вибухів бомб на 6 ходів.
blast.rubble.name=Уламки
blast.rubble.desc=Кам’яні уламки після вибуху бомби. Перекривають шлях, але наступний вибух може їх прибрати.
blast.remote_bomb.timed_mode=Режим таймера (утримати: перемкнути)
blast.remote_bomb.capacity_required=Для кидка бомби з таймером потрібна максимальна місткість щонайменше 2. Останнє місце зберігається для дистанційних бомб. Тест нескінченних бомб скасовує це обмеження.
blast.remote_bomb.last_slot=Максимальна місткість зменшилася до 1. Щоб знову кидати бомби з таймером, використайте ще одну бомбу для поповнення. Коли всі запалені бомби зникнуть, дистанційний режим відновиться автоматично.
blast.remote_bomb.switch_blocked=Не можна змінити режим, поки на поверсі є запалена бомба.
blast.remote_bomb.timed_enabled=Режим таймера ввімкнено.
blast.remote_bomb.remote_enabled=Дистанційний режим увімкнено.
blast.bomb_maniac.remote_throw=Дистанційний кидок (утримати: налаштувати)
blast.bomb_maniac.timed_throw=Кидок з таймером (утримати: налаштувати)
blast.bomb_maniac.aim=Виберіть місце кидка
blast.death_bomb.name=Посмертна контрбомба
blast.death_bomb.desc=Бомба на зразок бомби Тенґу, яку кидають у героя, коли ворог гине від вибуху Бомбомана й не залишає здобичі. Відраховує 3, 2, 1 і завдає шкоди персонажам у межах двох клітин. Її не можна підбирати.
blast.death_bomb.cant_pickup=Ворожі контрбомби не можна підбирати.
blast.death_bomb.ondeath=Вас убила посмертна контрбомба.
