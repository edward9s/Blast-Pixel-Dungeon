blast.remote_bomb.buff_name=Controlo de bombas
blast.remote_bomb.buff_desc=Mantém premido o botão de bomba inferior para alternar entre os modos remoto e temporizado, desde que não existam bombas acesas neste piso. Modo remoto: coloca bombas aos teus pés sem gastar turnos e detona a mais antiga com o botão inferior. Modo temporizado: aponta e lança bombas gastando 1 turno; explodem automaticamente. O botão inferior apresenta a contagem decrescente mais curta em vez do coração. O modo escolhido mantém-se ao guardar e ressuscitar. Cada lançamento temporizado exige pelo menos 2 espaços e reduz permanentemente a capacidade máxima em 1; o último fica reservado às bombas remotas. O teste de bombas infinitas anula estes limites. Com capacidade 1, o modo remoto regressa quando já não houver bombas acesas.
blast.remote_bomb.detonate=Detonar bomba remota (manter: alternar)
blast.settings.infinite_bomb=Teste: bombas infinitas
blast.bomb_maniac.buff_name=Maníaco das bombas
blast.bomb_maniac.buff_desc=Prime o botão na margem do ecrã para colocar uma bomba remota aos teus pés sem gastar turnos ou para apontar e lançar uma bomba temporizada gastando um turno, consoante o modo. Máximo colocado: %s. Disponíveis: %s. Mantém premido para selecionar ou imbuir bombas. As explosões libertam espaços de colocação. As bombas apagadas e recuperadas podem ser imbuídas para recuperar espaços ocupados. Cada lançamento temporizado exige pelo menos 2 espaços e reduz permanentemente a capacidade máxima em 1; o último fica reservado às bombas remotas. O teste de bombas infinitas anula estes limites. Com capacidade 1, o modo remoto regressa quando já não houver bombas acesas.
blast.bomb_maniac.window_title=Maníaco das bombas
blast.bomb_maniac.capacity=Capacidade: %s / Disponíveis: %s
blast.bomb_maniac.imbue=Imbuir bomba
blast.bomb_maniac.imbue_prompt=Escolhe uma bomba para imbuir
blast.bomb_maniac.throw=Colocar bomba (manter: configurar)
blast.bomb_maniac.no_charges=Não há bombas disponíveis até uma explodir ou uma bomba apagada e recuperada ser imbuída.
blast.bomb_maniac.blocked=Não é possível colocar uma bomba acesa aqui.
blast.bomb.lit_pickup=As bombas acesas não podem ser apanhadas.
blast.free_movement.buff_name=Atravessar obstáculos
blast.free_movement.buff_desc=Permite atravessar paredes, portas trancadas e bombas acesas. Restam %s turnos. Durante o efeito, as bombas lançadas do inventário e as pontapeadas por monstros raros atravessam o terreno e as personagens antes de aterrarem.
blast.radius.buff_name=Explosões ampliadas
blast.radius.buff_desc=Todas as bombas têm +%s de raio de explosão. As recolhas normais aumentam-no no máximo em +1.
blast.indestructible.buff_name=Imunidade a bombas
blast.indestructible.buff_desc=Imune aos danos das explosões de bombas durante mais %s turnos.
blast.radius_pickup.name=Melhoria de explosão flamejante
blast.radius_pickup.desc=Ao apanhar este objeto, o raio de explosão de todas as bombas aumenta imediatamente em 1 (limite de +1 por recolha normal). Se já tiveres este efeito, cada recolha adicional dá 10 moedas de ouro. Se o objeto for destruído por fogo ou por uma explosão, surgem até 8 monstros nas proximidades com adrenalina durante 1 000 000 de turnos.
blast.haste_pickup.name=Botas de velocidade
blast.haste_pickup.desc=Apanhá-las concede imediatamente o efeito de uma Poção de Rapidez (velocidade de movimento triplicada durante 20 turnos), sem beber uma poção. Se a Rapidez já estiver ativa, a duração aumenta em 20 turnos em vez de receberes ouro. Se forem destruídas por fogo ou por uma explosão, surgem até 8 monstros nas proximidades com adrenalina durante 1 000 000 de turnos.
blast.phase_potion.name=Poção de atravessar obstáculos
blast.phase_potion.desc=Bebe-a para atravessar paredes, portas trancadas e bombas acesas durante 6 turnos. As bombas lançadas do inventário e as pontapeadas por monstros raros atravessam obstáculos e personagens.
blast.bombproof_scroll.name=Pergaminho de proteção contra bombas
blast.bombproof_scroll.desc=Lê-o para ficares imune aos danos das explosões de bombas durante 6 turnos.
blast.rubble.name=Escombros
blast.rubble.desc=Destroços de pedra causados por uma bomba. Impedem a passagem, mas outra explosão pode eliminá-los.
blast.remote_bomb.timed_mode=Modo temporizado (manter: alternar)
blast.remote_bomb.capacity_required=Lançar bombas temporizadas exige uma capacidade máxima de pelo menos 2. O último espaço fica reservado às bombas remotas. O teste de bombas infinitas elimina esta restrição.
blast.remote_bomb.last_slot=A capacidade máxima desceu para 1. Imbui outra bomba para voltar a lançar bombas temporizadas. Quando não restarem bombas acesas, o modo remoto regressará automaticamente.
blast.remote_bomb.switch_blocked=Não é possível mudar de modo enquanto existir uma bomba acesa neste piso.
blast.remote_bomb.timed_enabled=Modo temporizado ativado.
blast.remote_bomb.remote_enabled=Modo remoto ativado.
blast.bomb_maniac.remote_throw=Lançamento remoto (manter: configurar)
blast.bomb_maniac.timed_throw=Lançamento temporizado (manter: configurar)
blast.bomb_maniac.aim=Escolhe o local do lançamento
blast.death_bomb.name=Bomba de contra-ataque mortal
blast.death_bomb.desc=Uma bomba do tipo Tengu lançada na direção do herói quando um inimigo morre numa explosão do Maníaco das bombas sem deixar saque. Conta 3, 2, 1 e causa danos às personagens a até duas casas de distância. Não pode ser apanhada.
blast.death_bomb.cant_pickup=Não é possível apanhar as bombas de contra-ataque dos inimigos.
blast.death_bomb.ondeath=Foste morto por uma bomba de contra-ataque mortal.
