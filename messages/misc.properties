blast.remote_bomb.buff_name=Bomb control
blast.remote_bomb.buff_desc=Hold the lower bomb Tag to switch modes when no lit bombs remain. Timed mode requires at least 2 maximum bomb slots. Each timed throw permanently removes 1 maximum slot, preserving the last slot for remote bombs, except while the Infinite bombs test is enabled. After all lit bombs are gone, capacity 1 automatically restores remote mode. Remote mode: place bombs at your feet instantly and detonate the oldest one with the lower Tag. Timed mode: throw for 1 turn and wait for automatic explosion. The selected mode is saved.
blast.remote_bomb.detonate=Detonate remote bomb (hold: switch)
blast.settings.infinite_bomb=Test: Infinite bombs
blast.bomb_maniac.buff_name=Bomb Maniac
blast.bomb_maniac.buff_desc=Tap the edge button to place a remote bomb at your feet for zero turns, or aim and throw a timed bomb for one turn, depending on mode. Maximum capacity: %s. Available: %s. Long-press to select or imbue bombs. Remote bombs return occupied slots on explosion. Each timed throw permanently reduces maximum capacity by 1, down to a minimum of 1, except during the Infinite bombs test. Imbue inventory bombs to increase capacity. Extinguished recovered bombs can be imbued to reclaim their occupied slots.
blast.bomb_maniac.window_title=Bomb Maniac
blast.bomb_maniac.capacity=Capacity: %s / Available: %s
blast.bomb_maniac.imbue=Imbue bomb
blast.bomb_maniac.imbue_prompt=Choose a bomb to imbue
blast.bomb_maniac.throw=Place bomb (hold: setup)
blast.bomb_maniac.no_charges=No bombs available until one explodes or a recovered bomb is imbued.
blast.bomb_maniac.blocked=Cannot place an armed bomb here.
blast.bomb.lit_pickup=Lit bombs cannot be picked up.
blast.free_movement.buff_name=Phase movement
blast.free_movement.buff_desc=Walk through walls, locked doors, and armed bombs. Remaining: %s turns. While active, bombs thrown from inventory and rare-monster kicks pass through terrain and characters before landing.
blast.radius.buff_name=Expanded blasts
blast.radius.buff_desc=All bombs have +%s explosion radius. Normal pickups grant at most +1.
blast.indestructible.buff_name=Bombproof
blast.indestructible.buff_desc=Immune to bomb explosion damage for %s more turns.
blast.radius_pickup.name=Fire blast upgrade
blast.radius_pickup.desc=Automatically increases the range of every bomb by 1 when picked up (normal pickup cap +1). If you already have the buff, each additional pickup grants 10 gold. Losing this item to fire or an explosion summons up to 8 monsters near the destroyed item with 1,000,000 turns of adrenaline.
blast.haste_pickup.name=Speed boots
blast.haste_pickup.desc=Picking these up immediately grants the Potion of Haste effect (triple movement speed for 20 turns), without drinking a potion. If Haste is already active, the pickup adds another 20 turns to the remaining duration rather than granting gold. If destroyed by fire or an explosion, it summons up to 8 nearby monsters with Adrenaline for 1,000,000 turns.
blast.phase_potion.name=Potion of phase movement
blast.phase_potion.desc=Drink to move through walls, locked doors, and armed bombs for 6 turns. Bombs thrown from inventory and rare-monster kicks pass through obstacles and characters.
blast.bombproof_scroll.name=Scroll of bombproofing
blast.bombproof_scroll.desc=Read to become immune to bomb explosion damage for 6 turns.
blast.rubble.name=Rubble
blast.rubble.desc=Rockfall debris created by a bomb. It blocks movement but can be cleared by one more explosion.
blast.remote_bomb.timed_mode=Timed bomb mode (hold: switch)
blast.remote_bomb.capacity_required=Timed throws require at least 2 maximum bomb slots. The last slot is reserved for remote bombs. Enable the Infinite bombs test to bypass both restrictions.
blast.remote_bomb.last_slot=Maximum bomb capacity is now 1. Timed throws are disabled until you imbue another bomb; remote mode returns after all lit bombs are gone.
blast.remote_bomb.switch_blocked=Cannot switch modes while any bomb is lit on this floor.
blast.remote_bomb.timed_enabled=Timed bomb mode enabled.
blast.remote_bomb.remote_enabled=Remote bomb mode enabled.
