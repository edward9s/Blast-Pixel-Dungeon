blast.death_bomb.name=Death counterbomb
blast.death_bomb.desc=A Tengu-style bomb hurled toward the Hero when an enemy dies to a Bomb Maniac explosion without dropping loot. It counts down 3, 2, 1 and damages characters within two tiles. It cannot be picked up.
blast.death_bomb.cant_pickup=Enemy counterbombs cannot be picked up.
blast.death_bomb.ondeath=You were killed by a death counterbomb.
