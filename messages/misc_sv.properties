blast.remote_bomb.buff_name=Bombkontroll
blast.remote_bomb.buff_desc=Håll in den nedre bombknappen för att växla mellan fjärrläge och tidsläge när inga tända bomber finns kvar på våningen. I fjärrläge kan du placera bomber vid dina fötter utan att använda en tur och detonera den äldsta med den nedre knappen. I tidsläge siktar och kastar du bomber för 1 tur; de exploderar automatiskt. Den nedre knappen visar den kortaste återstående tiden i stället för hjärtat. Valt läge sparas och behålls efter återupplivning. Varje tidsinställt kast kräver minst 2 platser och minskar maxkapaciteten permanent med 1; den sista platsen är reserverad för fjärrbomber. Testet med oändliga bomber tar bort dessa begränsningar. Vid kapacitet 1 återgår spelet till fjärrläge när alla tända bomber försvunnit.
blast.remote_bomb.detonate=Detonera bomb (håll: växla)
blast.settings.infinite_bomb=Test: oändliga bomber
blast.bomb_maniac.buff_name=Bombgalning
blast.bomb_maniac.buff_desc=Tryck på knappen vid skärmens kant för att placera en fjärrbomb vid dina fötter utan att använda en tur, eller sikta och kasta en tidsinställd bomb för 1 tur, beroende på läge. Max placerade: %s. Tillgängliga: %s. Håll in för att välja eller använda bomber som påfyllning. Explosioner frigör upptagna platser. Upphittade släckta bomber kan användas för att återfå upptagna platser. Varje tidsinställt kast kräver minst 2 platser och minskar maxkapaciteten permanent med 1; den sista platsen är reserverad för fjärrbomber. Testet med oändliga bomber tar bort dessa begränsningar. Vid kapacitet 1 återgår spelet till fjärrläge när alla tända bomber försvunnit.
blast.bomb_maniac.window_title=Bombgalning
blast.bomb_maniac.capacity=Kapacitet: %s / Tillgängliga: %s
blast.bomb_maniac.imbue=Använd bomb som påfyllning
blast.bomb_maniac.imbue_prompt=Välj bomb för påfyllning
blast.bomb_maniac.throw=Placera bomb (håll: inställningar)
blast.bomb_maniac.no_charges=Inga bomber tillgängliga förrän en exploderar eller en upphittad släckt bomb används som påfyllning.
blast.bomb_maniac.blocked=Kan inte placera en tänd bomb här.
blast.bomb.lit_pickup=Tända bomber kan inte plockas upp.
blast.free_movement.buff_name=Gå genom hinder
blast.free_movement.buff_desc=Du kan gå genom väggar, låsta dörrar och tända bomber. Återstår: %s turer. Under effekten passerar bomber som kastas från förrådet och bomber som sparkas av sällsynta monster genom terräng och figurer innan de landar.
blast.radius.buff_name=Större explosioner
blast.radius.buff_desc=Alla bomber får +%s i explosionsradie. Vanlig upplockning ger högst +1.
blast.indestructible.buff_name=Bombimmunitet
blast.indestructible.buff_desc=Immun mot skada från bombexplosioner i ytterligare %s turer.
blast.radius_pickup.name=Förstärkning av eldexplosioner
blast.radius_pickup.desc=När föremålet plockas upp ökar explosionsradien för alla bomber omedelbart med 1 (vanligt tak +1). Om du redan har effekten får du i stället 10 guld. Om föremålet förstörs av eld eller explosion dyker upp till 8 monster upp i närheten med adrenalin i 1 000 000 turer.
blast.haste_pickup.name=Hastighetsstövlar
blast.haste_pickup.desc=Vid upplockning får du omedelbart effekten av en hastighetsdryck (tre gånger rörelsehastigheten i 20 turer), utan att dricka. Om effekten redan är aktiv förlängs den med 20 turer i stället för att ge guld. Om föremålet förstörs av eld eller explosion dyker upp till 8 monster upp i närheten med adrenalin i 1 000 000 turer.
blast.phase_potion.name=Dryck för att gå genom hinder
blast.phase_potion.desc=Drick för att gå genom väggar, låsta dörrar och tända bomber i 6 turer. Bomber som kastas från förrådet och sparkas av sällsynta monster passerar också genom hinder och figurer.
blast.bombproof_scroll.name=Rulle med bombskydd
blast.bombproof_scroll.desc=Läs för att bli immun mot skada från bombexplosioner i 6 turer.
blast.rubble.name=Bråte
blast.rubble.desc=Nedrasade stenar orsakade av en bomb. De blockerar vägen men kan röjas av ytterligare en explosion.
blast.remote_bomb.timed_mode=Tidsläge (håll: växla)
blast.remote_bomb.capacity_required=För att kasta tidsinställda bomber krävs en maxkapacitet på minst 2. Den sista platsen är reserverad för fjärrbomber. Testet med oändliga bomber tar bort begränsningen.
blast.remote_bomb.last_slot=Maxkapaciteten har sjunkit till 1. Använd en ny bomb som påfyllning för fler tidsinställda kast. När inga tända bomber finns kvar återgår spelet automatiskt till fjärrläge.
blast.remote_bomb.switch_blocked=Det går inte att byta läge så länge en tänd bomb finns på våningen.
blast.remote_bomb.timed_enabled=Tidsläge aktiverat.
blast.remote_bomb.remote_enabled=Fjärrläge aktiverat.
blast.bomb_maniac.remote_throw=Fjärrkast (håll: inställningar)
blast.bomb_maniac.timed_throw=Tidsinställt kast (håll: inställningar)
blast.bomb_maniac.aim=Välj kastplats
blast.death_bomb.name=Dödlig motattackbomb
blast.death_bomb.desc=En bomb av Tengu-typ som kastas mot hjälten när en fiende dör av Bombgalningens explosion utan att släppa byte. Den räknar ner 3, 2, 1 och skadar figurer inom två rutors avstånd. Den kan inte plockas upp.
blast.death_bomb.cant_pickup=Fiendens motattackbomber kan inte plockas upp.
blast.death_bomb.ondeath=Du dödades av en dödlig motattackbomb.
