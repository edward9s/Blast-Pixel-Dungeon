blast.bomb_maniac.no_charges=Kullanılabilir bomba yok. Bir bombanın patlamasını bekle veya geri alınmış sönük bir bombayı kullan.
blast.bomb_maniac.blocked=Buraya ateşlenmiş bomba yerleştirilemez.
blast.bomb.lit_pickup=Ateşlenmiş bombalar alınamaz.
blast.free_movement.buff_name=Engellerden geçiş
blast.free_movement.buff_desc=Duvarlardan, kilitli kapılardan ve ateşlenmiş bombalardan geçebilirsin. Kalan: %s tur. Etki sırasında envanterden fırlatılan veya nadir canavarlarca tekmelenen bombalar, yere düşmeden önce araziden ve karakterlerden geçer.
blast.radius.buff_name=Genişletilmiş patlamalar
blast.radius.buff_desc=Tüm bombaların patlama yarıçapı +%s artar. Normal toplama en fazla +1 kazandırır.
blast.indestructible.buff_name=Bombaya dayanıklılık
blast.indestructible.buff_desc=%s tur daha bomba patlaması hasarına karşı bağışıksın.
blast.radius_pickup.name=Ateş patlaması geliştirmesi
blast.radius_pickup.desc=Alındığında tüm bombaların patlama yarıçapını hemen 1 artırır (normal toplama sınırı +1). Etki zaten varsa sonraki alımlar 10 altın verir. Ateş veya patlamayla yok edilirse yakında 1.000.000 tur adrenalin etkisine sahip en fazla 8 canavar belirir.
blast.haste_pickup.name=Hız çizmeleri
blast.haste_pickup.desc=Alındığında iksir içmeden hemen Hız İksiri etkisi verir (20 tur boyunca üç kat hareket hızı). Etki zaten varsa altın yerine süreye 20 tur eklenir. Ateş veya patlamayla yok edilirse yakında 1.000.000 tur adrenalin etkisine sahip en fazla 8 canavar belirir.
blast.phase_potion.name=Engellerden geçiş iksiri
blast.phase_potion.desc=İçerek 6 tur boyunca duvarlardan, kilitli kapılardan ve ateşlenmiş bombalardan geç. Envanterden fırlatılan veya nadir canavarlarca tekmelenen bombalar da engellerden ve karakterlerden geçer.
blast.bombproof_scroll.name=Bomba koruması parşömeni
blast.bombproof_scroll.desc=Okuyarak 6 tur boyunca bomba patlaması hasarına karşı bağışıklık kazan.
blast.rubble.name=Enkaz
blast.rubble.desc=Bombanın oluşturduğu kaya parçaları. Geçişi engeller ama bir sonraki patlamayla temizlenebilir.
blast.remote_bomb.timed_mode=Zamanlayıcılı mod (basılı tut: değiştir)
blast.remote_bomb.capacity_required=Zamanlayıcılı bomba fırlatmak için en az 2 azami bomba yuvası gerekir. Son yuva uzaktan kumandalı bombalara ayrılır. Sonsuz bomba testi bu sınırı kaldırır.
blast.remote_bomb.last_slot=Azami kapasite 1'e düştü. Yeniden zamanlayıcılı bomba fırlatmak için bir bomba daha kullanarak kapasiteyi artır. Ateşlenmiş bomba kalmayınca uzaktan kumanda moduna otomatik dönülür.
blast.remote_bomb.switch_blocked=Bu katta ateşlenmiş bomba varken mod değiştirilemez.
blast.remote_bomb.timed_enabled=Zamanlayıcılı mod etkinleştirildi.
blast.remote_bomb.remote_enabled=Uzaktan kumanda modu etkinleştirildi.
