blast.remote_bomb.buff_name=Bomba kontrolü
blast.remote_bomb.buff_desc=Alt bomba düğmesini basılı tutarak uzaktan kumanda ve zamanlayıcılı mod arasında geçiş yapabilirsin; ancak katta ateşlenmiş bomba kalmamalı. Uzaktan kumanda modunda tur harcamadan ayaklarının altına bomba yerleştir ve alt düğmeyle en eskisini patlat. Zamanlayıcılı modda 1 tur harcayarak nişan alıp bomba fırlat; bomba kendiliğinden patlar. Alt düğme kalp yerine en kısa kalan süreyi gösterir. Seçilen mod kayıttan ve yeniden dirilmeden sonra korunur. Her zamanlayıcılı atış için en az 2 kapasite gerekir ve azami kapasite kalıcı olarak 1 azalır; son yuva uzaktan kumandalı bombalar içindir. Sonsuz bomba testi bu sınırları kaldırır. Kapasite 1'e düşünce tüm ateşlenmiş bombalar yok olduktan sonra uzaktan kumanda modu geri gelir.
blast.remote_bomb.detonate=Bombayı patlat (basılı tut: değiştir)
blast.settings.infinite_bomb=Test: sonsuz bomba
blast.bomb_maniac.buff_name=Bomba delisi
blast.bomb_maniac.buff_desc=Ekranın kenarındaki düğmeye basarak uzaktan kumanda modunda tur harcamadan ayaklarının altına bomba yerleştir ya da zamanlayıcılı modda 1 tur harcayarak nişan alıp bomba fırlat. En fazla yerleştirilen: %s. Kullanılabilir: %s. Bomba seçmek veya bomba kullanarak kapasiteyi doldurmak için basılı tut. Patlamalar dolu yuvaları boşaltır. Söndürülüp geri alınan bombalar da dolu yuvaları geri kazanmak için kullanılabilir. Her zamanlayıcılı atış için en az 2 kapasite gerekir ve azami kapasite kalıcı olarak 1 azalır; son yuva uzaktan kumandalı bombalar içindir. Sonsuz bomba testi bu sınırları kaldırır. Kapasite 1'e düşünce tüm ateşlenmiş bombalar yok olduktan sonra uzaktan kumanda modu geri gelir.
