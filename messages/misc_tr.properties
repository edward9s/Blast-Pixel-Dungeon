blast.death_bomb.name=Ölüm karşı saldırı bombası
blast.death_bomb.desc=Bir düşman Bomba Delisi patlamasında ganimet düşürmeden ölürse kahramana doğru fırlatılan Tengu tarzı bomba. 3, 2, 1 diye geri sayar ve iki kare içindeki karakterlere hasar verir. Alınamaz.
blast.death_bomb.cant_pickup=Düşman karşı saldırı bombaları alınamaz.
blast.death_bomb.ondeath=Ölüm karşı saldırı bombası tarafından öldürüldün.
