blast.save_transfer.permission=Дазвольце кіраванне файламі і паўтарыце спробу.
blast.remote_bomb.buff_name=Кіраванне бомбамі
blast.remote_bomb.buff_desc=Утрымлівайце ніжнюю кнопку бомбы, каб пераключаць дыстанцыйны рэжым і рэжым таймера, калі на паверсе няма запаленых бомб. Дыстанцыйны рэжым: імгненна кладзіце бомбу пад ногі без выдатку ходу, а ніжняй кнопкай падрывайце найстарэйшую. Рэжым таймера: прыцэльна кідайце бомбу за 1 ход; яна выбухне аўтаматычна. Ніжняя кнопка паказвае найкарацейшы час да выбуху замест сэрца. Абраны рэжым захоўваецца пасля запісу гульні і ўваскрашэння. Кідкі з таймерам патрабуюць ёмістасці не менш за 2 і незваротна памяншаюць яе на 1 за кожны кідок; апошняе месца застаецца для дыстанцыйнага рэжыму. Тэст бясконцых бомб выключае гэтыя абмежаванні. Пры ёмістасці 1 пасля знікнення запаленых бомб аўтаматычна ўключаецца дыстанцыйны рэжым.
blast.remote_bomb.detonate=Падарваць бомбу (утрымаць: змяніць)
blast.settings.infinite_bomb=Тэст: бясконцыя бомбы
blast.bomb_maniac.buff_name=Бомбавы маньяк
blast.bomb_maniac.buff_desc=Націсніце кнопку ля краю экрана, каб у дыстанцыйным рэжыме пакласці бомбу пад ногі без выдатку ходу, або ў рэжыме таймера прыцэльна кінуць бомбу за 1 ход. Максімум размешчаных: %s. Даступна: %s. Утрымлівайце, каб выбраць або выкарыстаць бомбы для папаўнення. Выбухі вызваляюць занятыя месцы. Згаслыя падабраныя бомбы можна выкарыстаць для вяртання занятых месцаў. Кідкі з таймерам патрабуюць ёмістасці не менш за 2 і незваротна памяншаюць яе на 1 за кожны кідок; апошняе месца застаецца для дыстанцыйнага рэжыму. Тэст бясконцых бомб выключае гэтыя абмежаванні. Пры ёмістасці 1 пасля знікнення запаленых бомб аўтаматычна ўключаецца дыстанцыйны рэжым.
blast.bomb_maniac.window_title=Бомбавы маньяк
blast.bomb_maniac.capacity=Ёмістасць: %s / Даступна: %s
blast.bomb_maniac.imbue=Выкарыстаць бомбу для папаўнення
blast.bomb_maniac.imbue_prompt=Абярыце бомбу для папаўнення
blast.bomb_maniac.throw=Пакласці бомбу (утрымаць: наладзіць)
blast.bomb_maniac.no_charges=Няма даступных бомб. Дачакайцеся выбуху адной з іх або выкарыстайце падабраную згаслую бомбу.
blast.bomb_maniac.blocked=Тут нельга размясціць запаленую бомбу.
blast.bomb.lit_pickup=Запаленыя бомбы нельга падбіраць.
blast.free_movement.buff_name=Праход праз перашкоды
blast.free_movement.buff_desc=Можна праходзіць праз сцены, замкнёныя дзверы і запаленыя бомбы. Засталося %s хадоў. Падчас дзеяння эфекту бомбы з інвентару і бомбы, якія штурхаюць рэдкія монстры, праходзяць праз мясцовасць і персанажаў перад прызямленнем.
blast.radius.buff_name=Павялічаныя выбухі
blast.radius.buff_desc=Радыус выбуху ўсіх бомб павялічаны на %s. Звычайны падбор дадае не больш за +1.
blast.indestructible.buff_name=Абарона ад бомб
blast.indestructible.buff_desc=Імунітэт да шкоды ад выбухаў бомб яшчэ на %s хадоў.
blast.radius_pickup.name=Узмацненне вогненнага выбуху
blast.radius_pickup.desc=Пры падборы радыус выбуху ўсіх бомб адразу павялічваецца на 1 (звычайная мяжа +1). Калі эфект ужо дзейнічае, дадатковы падбор дае 10 золата. Калі прадмет знішчаны агнём або выбухам, побач з'явіцца да 8 монстраў з адрэналінам на 1 000 000 хадоў.
blast.haste_pickup.name=Боты хуткасці
blast.haste_pickup.desc=Пры падборы імгненна даюць эфект зелля хуткасці (патроеная хуткасць руху на 20 хадоў) без выпівання зелля. Калі эфект ужо дзейнічае, працягласць павялічваецца на 20 хадоў замест золата. Калі прадмет знішчаны агнём або выбухам, побач з'явіцца да 8 монстраў з адрэналінам на 1 000 000 хадоў.
blast.phase_potion.name=Зелле праходу праз перашкоды
blast.phase_potion.desc=Выпіце, каб 6 хадоў праходзіць праз сцены, замкнёныя дзверы і запаленыя бомбы. Бомбы з інвентару і бомбы, якія штурхаюць рэдкія монстры, праходзяць праз перашкоды і персанажаў.
blast.bombproof_scroll.name=Скрутак абароны ад бомб
blast.bombproof_scroll.desc=Прачытайце, каб на 6 хадоў атрымаць імунітэт да шкоды ад выбухаў бомб.
blast.rubble.name=Абломкі
blast.rubble.desc=Каменныя абломкі пасля выбуху бомбы. Перакрываюць праход, але наступны выбух можа іх прыбраць.
blast.remote_bomb.timed_mode=Рэжым таймера (утрымаць: змяніць)
blast.remote_bomb.capacity_required=Для кідка бомбы з таймерам патрэбныя не менш за 2 месцы максімальнай ёмістасці. Апошняе месца захоўваецца для дыстанцыйных бомб. Тэст бясконцых бомб здымае гэта абмежаванне.
blast.remote_bomb.last_slot=Максімальная ёмістасць знізілася да 1. Каб зноў кідаць бомбы з таймерам, дадайце бомбу. Калі ўсе запаленыя бомбы знікнуць, вернецца дыстанцыйны рэжым.
blast.remote_bomb.switch_blocked=Нельга змяніць рэжым, пакуль на паверсе ёсць запаленая бомба.
blast.remote_bomb.timed_enabled=Рэжым таймера ўключаны.
blast.remote_bomb.remote_enabled=Дыстанцыйны рэжым уключаны.
blast.bomb_maniac.remote_throw=Дыстанцыйны кідок (утрымаць: наладзіць)
blast.bomb_maniac.timed_throw=Кідок з таймерам (утрымаць: наладзіць)
blast.bomb_maniac.aim=Абярыце месца кідка
blast.death_bomb.name=Пасмяротная бомба-адплата
blast.death_bomb.desc=Бомба накшталт бомбы Тэнгу, якую кідаюць у героя, калі вораг гіне ад выбуху Бомбавага маньяка без здабычы. Адлічвае 3, 2, 1 і наносіць шкоду персанажам у межах дзвюх клетак. Яе нельга падбіраць.
blast.death_bomb.cant_pickup=Варожыя бомбы-адплаты нельга падбіраць.
blast.death_bomb.ondeath=Вас забіла пасмяротная бомба-адплата.
