blast.settings.indestructible_test_desc=Тэст абароны ад бомб уключаны. Выбухі бомб не наносяць шкоды, пакуль налада не будзе выключана.
blast.settings.free_movement_test_desc=Тэст праходу праз перашкоды ўключаны. Можна праходзіць праз падтрыманыя перашкоды, пакуль налада не будзе выключана.
blast.settings.remote_throw_test_desc=Тэст дыстанцыйнага кідка ўключаны. У дыстанцыйным рэжыме можна прыцэліцца і кінуць кіраваную бомбу без выдатку ходу, а потым падарваць яе кнопкай кіравання.
