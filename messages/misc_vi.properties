blast.settings.debug_log=Nhật ký gỡ lỗi
blast.settings.indestructible=Thử nghiệm: miễn sát thương bom
blast.settings.free_movement=Thử nghiệm: đi xuyên vật cản
blast.settings.remote_throw=Thử nghiệm: ném từ xa
blast.settings.indestructible_test_desc=Đã bật thử nghiệm miễn sát thương bom. Bạn sẽ không chịu sát thương từ vụ nổ bom cho đến khi tắt tùy chọn này.
blast.settings.free_movement_test_desc=Đã bật thử nghiệm đi xuyên vật cản. Bạn có thể đi xuyên các vật cản được hỗ trợ cho đến khi tắt tùy chọn này.
blast.settings.remote_throw_test_desc=Đã bật thử nghiệm ném từ xa. Ở chế độ điều khiển từ xa, bạn có thể ngắm và ném bom điều khiển mà không mất lượt, sau đó kích nổ bằng nút từ xa.
blast.settings.radius=Thử nghiệm: bán kính nổ
blast.save_transfer.export=Xuất bản lưu
blast.save_transfer.import=Nhập bản lưu
blast.save_transfer.export_failed=Xuất bản lưu thất bại.
blast.save_transfer.import_failed=Nhập bản lưu thất bại.
blast.save_transfer.exported=Đã xuất bản lưu.
blast.save_transfer.no_save=Không tìm thấy bản lưu hợp lệ.
blast.save_transfer.permission=Hãy cấp quyền quản lý tệp rồi thử lại.
blast.remote_bomb.buff_name=Điều khiển bom
blast.remote_bomb.buff_desc=Nhấn giữ nút bom phía dưới để chuyển giữa chế độ điều khiển từ xa và chế độ hẹn giờ, khi không còn bom đang cháy ở tầng này. Chế độ từ xa: đặt bom dưới chân ngay lập tức mà không mất lượt, rồi dùng nút dưới để kích nổ quả đặt sớm nhất. Chế độ hẹn giờ: ngắm và ném bom tốn 1 lượt; bom tự phát nổ. Nút dưới hiện thời gian đếm ngược ngắn nhất thay cho biểu tượng trái tim. Chế độ đã chọn được giữ lại sau khi lưu và hồi sinh. Mỗi lần ném bom hẹn giờ cần dung lượng ít nhất 2 và giảm vĩnh viễn dung lượng tối đa đi 1; ô cuối cùng dành cho bom từ xa. Chế độ thử nghiệm bom vô hạn bỏ qua các giới hạn này. Khi dung lượng còn 1, chế độ từ xa sẽ trở lại sau khi tất cả bom đang cháy biến mất.
blast.remote_bomb.detonate=Kích nổ bom (giữ: đổi chế độ)
blast.settings.infinite_bomb=Thử nghiệm: bom vô hạn
blast.bomb_maniac.buff_name=Cuồng bom
blast.bomb_maniac.buff_desc=Chạm nút ở mép màn hình để đặt bom điều khiển dưới chân mà không mất lượt ở chế độ từ xa, hoặc ngắm và ném bom hẹn giờ mất 1 lượt ở chế độ hẹn giờ. Số bom đặt tối đa: %s. Còn dùng được: %s. Nhấn giữ để chọn hoặc nạp bom. Các vụ nổ trả lại vị trí đã dùng. Có thể nạp bom đã tắt và nhặt lại để thu hồi vị trí đang chiếm. Mỗi lần ném bom hẹn giờ cần dung lượng ít nhất 2 và giảm vĩnh viễn dung lượng tối đa đi 1; ô cuối cùng dành cho bom từ xa. Chế độ thử nghiệm bom vô hạn bỏ qua các giới hạn này. Khi dung lượng còn 1, chế độ từ xa sẽ trở lại sau khi tất cả bom đang cháy biến mất.
blast.bomb_maniac.window_title=Cuồng bom
blast.bomb_maniac.capacity=Sức chứa: %s / Còn: %s
blast.bomb_maniac.imbue=Nạp bom
blast.bomb_maniac.imbue_prompt=Chọn bom để nạp
blast.bomb_maniac.throw=Đặt bom (giữ: thiết lập)
blast.bomb_maniac.no_charges=Không còn bom dùng được cho đến khi một quả phát nổ hoặc bạn nạp lại bom đã tắt và nhặt lại.
blast.bomb_maniac.blocked=Không thể đặt bom đang cháy ở đây.
blast.bomb.lit_pickup=Không thể nhặt bom đang cháy.
blast.free_movement.buff_name=Đi xuyên vật cản
blast.free_movement.buff_desc=Bạn có thể đi xuyên tường, cửa khóa và bom đang cháy. Còn %s lượt. Trong thời gian hiệu lực, bom ném từ túi đồ và bom do quái vật hiếm đá sẽ xuyên qua địa hình và nhân vật trước khi đáp xuống.
blast.radius.buff_name=Mở rộng vụ nổ
blast.radius.buff_desc=Bán kính nổ của mọi quả bom tăng %s. Nhặt vật phẩm thông thường chỉ tăng tối đa +1.
blast.indestructible.buff_name=Miễn sát thương bom
blast.indestructible.buff_desc=Miễn sát thương do bom nổ trong %s lượt nữa.
blast.radius_pickup.name=Nâng cấp vụ nổ lửa
blast.radius_pickup.desc=Khi nhặt, bán kính nổ của mọi quả bom tăng ngay 1 (giới hạn nhặt thông thường là +1). Nếu đã có hiệu ứng, mỗi lần nhặt thêm nhận 10 vàng. Nếu vật phẩm bị lửa hoặc vụ nổ phá hủy, tối đa 8 quái vật sẽ xuất hiện gần đó với hiệu ứng adrenaline kéo dài 1.000.000 lượt.
blast.haste_pickup.name=Giày tăng tốc
blast.haste_pickup.desc=Khi nhặt, lập tức nhận hiệu ứng Thuốc Tăng Tốc (di chuyển nhanh gấp ba trong 20 lượt) mà không cần uống thuốc. Nếu hiệu ứng đang hoạt động, thời gian được cộng thêm 20 lượt thay vì nhận vàng. Nếu bị lửa hoặc vụ nổ phá hủy, tối đa 8 quái vật xuất hiện gần đó với adrenaline kéo dài 1.000.000 lượt.
blast.phase_potion.name=Thuốc đi xuyên vật cản
blast.phase_potion.desc=Uống để đi xuyên tường, cửa khóa và bom đang cháy trong 6 lượt. Bom ném từ túi đồ và bom do quái vật hiếm đá cũng xuyên qua vật cản và nhân vật.
blast.bombproof_scroll.name=Cuộn giấy bảo vệ khỏi bom
blast.bombproof_scroll.desc=Đọc để miễn sát thương do bom nổ trong 6 lượt.
blast.rubble.name=Đống đổ nát
blast.rubble.desc=Đá vụn do bom làm sập. Chặn đường đi nhưng có thể bị dọn sạch bởi một vụ nổ khác.
blast.remote_bomb.timed_mode=Chế độ hẹn giờ (giữ: đổi)
blast.remote_bomb.capacity_required=Ném bom hẹn giờ cần dung lượng tối đa ít nhất là 2. Ô cuối cùng được dành cho bom điều khiển từ xa. Chế độ thử nghiệm bom vô hạn bỏ qua giới hạn này.
blast.remote_bomb.last_slot=Dung lượng tối đa đã giảm còn 1. Hãy nạp thêm một quả bom để tiếp tục ném bom hẹn giờ. Khi không còn bom đang cháy, trò chơi sẽ tự chuyển về chế độ từ xa.
blast.remote_bomb.switch_blocked=Không thể đổi chế độ khi vẫn có bom đang cháy ở tầng này.
blast.remote_bomb.timed_enabled=Đã bật chế độ hẹn giờ.
blast.remote_bomb.remote_enabled=Đã bật chế độ điều khiển từ xa.
blast.bomb_maniac.remote_throw=Ném từ xa (giữ: thiết lập)
blast.bomb_maniac.timed_throw=Ném hẹn giờ (giữ: thiết lập)
blast.bomb_maniac.aim=Chọn vị trí ném
blast.death_bomb.name=Bom phản công khi chết
blast.death_bomb.desc=Bom kiểu Tengu được ném về phía anh hùng khi kẻ địch chết do vụ nổ của Cuồng Bom mà không rơi chiến lợi phẩm. Bom đếm 3, 2, 1 rồi gây sát thương cho nhân vật trong phạm vi hai ô. Không thể nhặt.
blast.death_bomb.cant_pickup=Không thể nhặt bom phản công của kẻ địch.
blast.death_bomb.ondeath=Bạn đã bị bom phản công khi chết giết.
