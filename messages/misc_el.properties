blast.save_transfer.no_save=Δεν βρέθηκε έγκυρη αποθήκευση.
blast.save_transfer.permission=Επιτρέψτε τη διαχείριση αρχείων και δοκιμάστε ξανά.
blast.remote_bomb.buff_name=Χειρισμός βομβών
blast.remote_bomb.buff_desc=Κρατήστε πατημένο το κάτω κουμπί βόμβας για εναλλαγή μεταξύ τηλεχειρισμού και χρονοδιακόπτη, όταν δεν υπάρχουν αναμμένες βόμβες σε αυτόν τον όροφο. Τηλεχειρισμός: τοποθετήστε βόμβα στα πόδια σας χωρίς να ξοδέψετε γύρο και πυροδοτήστε την παλαιότερη με το κάτω κουμπί. Χρονοδιακόπτης: στοχεύστε και ρίξτε βόμβα ξοδεύοντας 1 γύρο· εκρήγνυται αυτόματα. Το κάτω κουμπί δείχνει τον συντομότερο χρόνο που απομένει αντί για καρδιά. Η επιλεγμένη λειτουργία διατηρείται μετά την αποθήκευση και την αναβίωση. Κάθε ρίψη με χρονοδιακόπτη απαιτεί χωρητικότητα τουλάχιστον 2 και μειώνει μόνιμα τη μέγιστη χωρητικότητα κατά 1, αφήνοντας την τελευταία θέση για τηλεχειρισμό. Η δοκιμή άπειρων βομβών εξαιρείται. Με χωρητικότητα 1 ο τηλεχειρισμός επανέρχεται μόλις σβήσουν όλες οι βόμβες.
blast.remote_bomb.detonate=Πυροδότηση βόμβας (κρατήστε: αλλαγή)
blast.settings.infinite_bomb=Δοκιμή: άπειρες βόμβες
blast.bomb_maniac.buff_name=Μανιακός των βομβών
blast.bomb_maniac.buff_desc=Πατήστε το κουμπί στην άκρη της οθόνης για να τοποθετήσετε μια τηλεχειριζόμενη βόμβα στα πόδια σας χωρίς να ξοδέψετε γύρο ή να στοχεύσετε και να ρίξετε μια βόμβα με χρονοδιακόπτη ξοδεύοντας 1 γύρο. Μέγιστο τοποθετημένων: %s. Διαθέσιμες: %s. Κρατήστε πατημένο για επιλογή ή ενσωμάτωση βομβών. Οι εκρήξεις ελευθερώνουν θέσεις. Οι σβησμένες βόμβες που μαζεύτηκαν μπορούν να ενσωματωθούν για να ανακτηθούν θέσεις. Κάθε ρίψη με χρονοδιακόπτη απαιτεί χωρητικότητα τουλάχιστον 2 και μειώνει μόνιμα τη μέγιστη χωρητικότητα κατά 1, αφήνοντας την τελευταία θέση για τηλεχειρισμό. Η δοκιμή άπειρων βομβών εξαιρείται. Με χωρητικότητα 1 ο τηλεχειρισμός επανέρχεται μόλις σβήσουν όλες οι βόμβες.
blast.bomb_maniac.window_title=Μανιακός των βομβών
blast.bomb_maniac.capacity=Χωρητικότητα: %s / Διαθέσιμες: %s
blast.bomb_maniac.imbue=Ενσωμάτωση βόμβας
blast.bomb_maniac.imbue_prompt=Επιλέξτε βόμβα για ενσωμάτωση
blast.bomb_maniac.throw=Τοποθέτηση βόμβας (κρατήστε: ρύθμιση)
blast.bomb_maniac.no_charges=Δεν υπάρχουν διαθέσιμες βόμβες μέχρι να εκραγεί μία ή να ενσωματωθεί μια σβησμένη βόμβα που μαζεύτηκε.
blast.bomb_maniac.blocked=Δεν μπορείτε να τοποθετήσετε αναμμένη βόμβα εδώ.
blast.bomb.lit_pickup=Δεν μπορείτε να μαζέψετε αναμμένες βόμβες.
blast.free_movement.buff_name=Διέλευση εμποδίων
blast.free_movement.buff_desc=Μπορείτε να περνάτε μέσα από τοίχους, κλειδωμένες πόρτες και αναμμένες βόμβες. Απομένουν %s γύροι. Κατά τη διάρκεια του εφέ, οι βόμβες που ρίχνονται από το απόθεμα και όσες κλοτσούν σπάνια τέρατα περνούν μέσα από το έδαφος και τους χαρακτήρες πριν προσγειωθούν.
blast.radius.buff_name=Μεγαλύτερες εκρήξεις
blast.radius.buff_desc=Η ακτίνα έκρηξης όλων των βομβών αυξάνεται κατά %s. Οι κανονικές συλλογές προσφέρουν το πολύ +1.
blast.indestructible.buff_name=Ανοσία στις βόμβες
blast.indestructible.buff_desc=Ανοσία στη ζημιά από εκρήξεις βομβών για άλλους %s γύρους.
blast.radius_pickup.name=Ενίσχυση πύρινης έκρηξης
blast.radius_pickup.desc=Η συλλογή αυξάνει αμέσως την ακτίνα έκρηξης όλων των βομβών κατά 1 (κανονικό όριο +1). Αν έχετε ήδη το εφέ, κάθε επιπλέον συλλογή δίνει 10 χρυσά. Αν το αντικείμενο καταστραφεί από φωτιά ή έκρηξη, εμφανίζονται κοντά έως 8 τέρατα με αδρεναλίνη για 1.000.000 γύρους.
blast.haste_pickup.name=Μπότες ταχύτητας
blast.haste_pickup.desc=Η συλλογή δίνει αμέσως το εφέ φίλτρου ταχύτητας (τριπλή ταχύτητα κίνησης για 20 γύρους), χωρίς να πιείτε φίλτρο. Αν είναι ήδη ενεργό, η διάρκειά του αυξάνεται κατά 20 γύρους αντί για χρυσό. Αν καταστραφεί από φωτιά ή έκρηξη, εμφανίζονται κοντά έως 8 τέρατα με αδρεναλίνη για 1.000.000 γύρους.
blast.phase_potion.name=Φίλτρο διέλευσης εμποδίων
blast.phase_potion.desc=Πιείτε για να περνάτε μέσα από τοίχους, κλειδωμένες πόρτες και αναμμένες βόμβες για 6 γύρους. Οι βόμβες από το απόθεμα και όσες κλοτσούν σπάνια τέρατα περνούν από εμπόδια και χαρακτήρες.
blast.bombproof_scroll.name=Πάπυρος προστασίας από βόμβες
blast.bombproof_scroll.desc=Διαβάστε για να αποκτήσετε ανοσία στη ζημιά από εκρήξεις βομβών για 6 γύρους.
blast.rubble.name=Μπάζα
blast.rubble.desc=Πέτρες που έπεσαν από έκρηξη βόμβας. Εμποδίζουν τη διέλευση αλλά απομακρύνονται με άλλη μία έκρηξη.
blast.remote_bomb.timed_mode=Λειτουργία χρονοδιακόπτη (κρατήστε: αλλαγή)
blast.remote_bomb.capacity_required=Οι ρίψεις βομβών με χρονοδιακόπτη απαιτούν μέγιστη χωρητικότητα τουλάχιστον 2. Η τελευταία θέση φυλάσσεται για τηλεχειριζόμενες βόμβες. Η δοκιμή άπειρων βομβών καταργεί αυτόν τον περιορισμό.
blast.remote_bomb.last_slot=Η μέγιστη χωρητικότητα μειώθηκε σε 1. Για νέες ρίψεις με χρονοδιακόπτη ενσωματώστε άλλη βόμβα. Όταν δεν απομένουν αναμμένες βόμβες, επανέρχεται αυτόματα ο τηλεχειρισμός.
blast.remote_bomb.switch_blocked=Δεν μπορείτε να αλλάξετε λειτουργία όσο υπάρχει αναμμένη βόμβα σε αυτόν τον όροφο.
blast.remote_bomb.timed_enabled=Η λειτουργία χρονοδιακόπτη ενεργοποιήθηκε.
blast.remote_bomb.remote_enabled=Η λειτουργία τηλεχειρισμού ενεργοποιήθηκε.
blast.bomb_maniac.remote_throw=Ρίψη εξ αποστάσεως (κρατήστε: ρύθμιση)
blast.bomb_maniac.timed_throw=Χρονομετρημένη ρίψη (κρατήστε: ρύθμιση)
blast.bomb_maniac.aim=Επιλέξτε θέση ρίψης
blast.death_bomb.name=Βόμβα θανάσιμης αντεπίθεσης
blast.death_bomb.desc=Βόμβα τύπου Tengu που εκτοξεύεται προς τον ήρωα όταν εχθρός πεθαίνει από έκρηξη του Μανιακού των βομβών χωρίς να αφήσει λάφυρα. Μετρά 3, 2, 1 και προκαλεί ζημιά σε χαρακτήρες εντός δύο τετραγώνων. Δεν μπορεί να συλλεχθεί.
blast.death_bomb.cant_pickup=Δεν μπορείτε να μαζέψετε τις βόμβες αντεπίθεσης των εχθρών.
blast.death_bomb.ondeath=Σκοτωθήκατε από βόμβα θανάσιμης αντεπίθεσης.
