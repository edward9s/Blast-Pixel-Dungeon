blast.settings.indestructible_test_desc=Η δοκιμή ανοσίας στις βόμβες είναι ενεργή. Οι εκρήξεις βομβών δεν προκαλούν ζημιά μέχρι να απενεργοποιήσετε τη ρύθμιση.
blast.settings.free_movement_test_desc=Η δοκιμή διέλευσης εμποδίων είναι ενεργή. Μπορείτε να περνάτε μέσα από τα υποστηριζόμενα εμπόδια μέχρι να απενεργοποιήσετε τη ρύθμιση.
blast.settings.remote_throw_test_desc=Η δοκιμή ρίψης εξ αποστάσεως είναι ενεργή. Στη λειτουργία τηλεχειρισμού μπορείτε να στοχεύετε και να ρίχνετε μια ελεγχόμενη βόμβα χωρίς να ξοδεύετε γύρο και μετά να την πυροδοτείτε από το τηλεχειριστήριο.
blast.settings.radius=Δοκιμή: ακτίνα έκρηξης
