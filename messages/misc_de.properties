blast.remote_bomb.buff_name=Bombensteuerung
blast.remote_bomb.buff_desc=Halte die untere Bomben-Schaltfläche gedrückt, um zwischen Fernsteuerungs- und Zeitmodus zu wechseln. Das ist nur möglich, wenn auf dieser Ebene keine gezündeten Bomben liegen. Fernsteuerung: Lege ohne Zugverbrauch Bomben zu deinen Füßen und zünde die älteste mit der unteren Schaltfläche. Zeitmodus: Ziele und wirf Bomben für 1 Zug; sie explodieren automatisch. Die untere Schaltfläche zeigt statt des Herzens die kürzeste verbleibende Zündzeit. Der gewählte Modus bleibt beim Speichern und Wiederbeleben erhalten. Zeitbombenwürfe erfordern mindestens 2 Plätze und verringern die maximale Kapazität dauerhaft um 1 pro Wurf. Der letzte Platz bleibt für Fernsteuerung. Der Test „Unendliche Bomben“ hebt diese Grenzen auf. Bei Kapazität 1 wird nach dem Erlöschen aller Bomben zur Fernsteuerung gewechselt.
blast.remote_bomb.detonate=Fernbombe zünden (halten: wechseln)
blast.settings.infinite_bomb=Test: Unendlich viele Bomben
blast.bomb_maniac.buff_name=Bombenfanatiker
blast.bomb_maniac.buff_desc=Drücke die Schaltfläche am Bildschirmrand, um je nach Modus ohne Zugverbrauch eine ferngesteuerte Bombe zu deinen Füßen zu legen oder für einen Zug eine Zeitbombe gezielt zu werfen. Maximal platziert: %s. Verfügbar: %s. Halte gedrückt, um Bomben auszuwählen oder einzubringen. Explosionen geben belegte Plätze wieder frei. Eingesammelte, erloschene Bomben können eingebracht werden, um belegte Plätze zurückzuerhalten. Zeitbombenwürfe erfordern mindestens 2 Plätze und verringern die maximale Kapazität dauerhaft um 1 pro Wurf. Der letzte Platz bleibt für Fernsteuerung. Der Test „Unendliche Bomben“ hebt diese Grenzen auf. Bei Kapazität 1 wird nach dem Erlöschen aller Bomben zur Fernsteuerung gewechselt.
blast.bomb_maniac.window_title=Bombenfanatiker
blast.bomb_maniac.capacity=Kapazität: %s / Verfügbar: %s
blast.bomb_maniac.imbue=Bombe einbringen
blast.bomb_maniac.imbue_prompt=Bombe zum Einbringen wählen
blast.bomb_maniac.throw=Bombe legen (halten: einstellen)
blast.bomb_maniac.no_charges=Keine Bomben verfügbar, bis eine explodiert oder eine eingesammelte, erloschene Bombe eingebracht wird.
blast.bomb_maniac.blocked=Hier kann keine gezündete Bombe platziert werden.
blast.bomb.lit_pickup=Gezündete Bomben können nicht aufgehoben werden.
blast.free_movement.buff_name=Durch Wände gehen
blast.free_movement.buff_desc=Du kannst durch Wände, verschlossene Türen und gezündete Bomben gehen. Verbleibend: %s Züge. Während des Effekts durchqueren Bomben aus dem Inventar sowie von seltenen Monstern getretene Bomben Gelände und Figuren, bevor sie landen.
blast.radius.buff_name=Größerer Explosionsradius
blast.radius.buff_desc=Alle Bomben erhalten +%s Explosionsradius. Durch normales Aufheben ist höchstens +1 möglich.
blast.indestructible.buff_name=Bombenschutz
blast.indestructible.buff_desc=Für weitere %s Züge immun gegen Schäden durch Bombenexplosionen.
blast.radius_pickup.name=Feuerexplosions-Verstärkung
blast.radius_pickup.desc=Beim Aufheben steigt der Explosionsradius aller Bomben sofort um 1 (Obergrenze durch normales Aufheben: +1). Falls der Effekt bereits aktiv ist, erhältst du stattdessen 10 Gold. Wird der Gegenstand durch Feuer oder eine Explosion zerstört, erscheinen in der Nähe bis zu 8 Monster mit Adrenalin für 1.000.000 Züge.
blast.haste_pickup.name=Geschwindigkeitsstiefel
blast.haste_pickup.desc=Beim Aufheben erhältst du sofort die Wirkung eines Hasttranks (dreifache Bewegungsgeschwindigkeit für 20 Züge), ohne einen Trank zu trinken. Ist Hast bereits aktiv, verlängert sich die Dauer um 20 Züge, statt Gold zu erhalten. Bei Zerstörung durch Feuer oder eine Explosion erscheinen bis zu 8 Monster in der Nähe mit Adrenalin für 1.000.000 Züge.
blast.phase_potion.name=Trank der Durchdringung
blast.phase_potion.desc=Trinke ihn, um 6 Züge lang durch Wände, verschlossene Türen und gezündete Bomben zu gehen. Bomben aus dem Inventar und von seltenen Monstern getretene Bomben durchqueren Hindernisse und Figuren.
blast.bombproof_scroll.name=Schriftrolle des Bombenschutzes
blast.bombproof_scroll.desc=Lies sie, um 6 Züge lang gegen Schaden durch Bombenexplosionen immun zu werden.
blast.rubble.name=Trümmer
blast.rubble.desc=Durch eine Bombe herabgestürzte Steine. Sie versperren den Weg, können aber durch eine weitere Explosion beseitigt werden.
blast.remote_bomb.timed_mode=Zeitmodus (halten: wechseln)
blast.remote_bomb.capacity_required=Für Zeitbombenwürfe sind mindestens 2 maximale Bombenplätze nötig. Der letzte Platz bleibt für ferngesteuerte Bomben reserviert. Der Test „Unendliche Bomben“ hebt diese Beschränkung auf.
blast.remote_bomb.last_slot=Die maximale Bombenkapazität beträgt jetzt 1. Für weitere Zeitbombenwürfe musst du eine Bombe einbringen. Sobald keine gezündeten Bomben mehr liegen, wird automatisch zur Fernsteuerung gewechselt.
blast.remote_bomb.switch_blocked=Der Modus kann nicht gewechselt werden, solange auf dieser Ebene eine Bombe gezündet ist.
blast.remote_bomb.timed_enabled=Zeitmodus aktiviert.
blast.remote_bomb.remote_enabled=Fernsteuerungsmodus aktiviert.
blast.bomb_maniac.remote_throw=Ferngesteuert werfen (halten: einstellen)
blast.bomb_maniac.timed_throw=Zeitbombe werfen (halten: einstellen)
