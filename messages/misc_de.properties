blast.death_bomb.name=Todes-Gegenangriffsbombe
blast.death_bomb.desc=Eine Bombe nach Tengu-Art, die auf den Helden geworfen wird, wenn ein Gegner durch eine Explosion des Bombenfanatikers stirbt, ohne Beute fallen zu lassen. Sie zählt 3, 2, 1 herunter und verletzt Figuren im Umkreis von zwei Feldern. Sie kann nicht aufgehoben werden.
blast.death_bomb.cant_pickup=Gegnerische Gegenangriffsbomben können nicht aufgehoben werden.
blast.death_bomb.ondeath=Du wurdest durch eine Todes-Gegenangriffsbombe getötet.
